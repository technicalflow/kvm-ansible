---
- name: FreeIPA Management Playbook
  hosts: "{{ target_hosts | default('spawned_vms:ipaserver:freeipa_server') }}"
  become: true
  collections:
    - freeipa.ansible_freeipa

  module_defaults:
    freeipa.ansible_freeipa.ipagroup:
      ipaadmin_password: "{{ ipa_admin_password }}"
    freeipa.ansible_freeipa.ipauser:
      ipaadmin_password: "{{ ipa_admin_password }}"
    freeipa.ansible_freeipa.ipapwpolicy:
      ipaadmin_password: "{{ ipa_admin_password }}"
    freeipa.ansible_freeipa.ipahost:
      ipaadmin_password: "{{ ipa_admin_password }}"
    freeipa.ansible_freeipa.ipahostgroup:
      ipaadmin_password: "{{ ipa_admin_password }}"
    freeipa.ansible_freeipa.ipahbacrule:
      ipaadmin_password: "{{ ipa_admin_password }}"
    freeipa.ansible_freeipa.ipasudocmd:
      ipaadmin_password: "{{ ipa_admin_password }}"
    freeipa.ansible_freeipa.ipasudorule:
      ipaadmin_password: "{{ ipa_admin_password }}"
    freeipa.ansible_freeipa.ipadnsrecord:
      ipaadmin_password: "{{ ipa_admin_password }}"

  tasks:
    # 1. Manage a FreeIPA Group
    - name: Ensure group 'developers' is present
      freeipa.ansible_freeipa.ipagroup:
        name: developers
        description: Development Team
        state: present

    # 2. Manage a FreeIPA User (with SSH public key)
    - name: Ensure user is present
      freeipa.ansible_freeipa.ipauser:
        name: leo
        first: Leonardo
        last: Da Vinci
        shell: /bin/bash
        sshpubkey:
          - "{{ lookup('ansible.builtin.file', ssh_pub_key_file) }}"
        state: present

    # 3. Add the User to the Group
    - name: Ensure user 'leo' is a member of the 'developers' group
      freeipa.ansible_freeipa.ipagroup:
        name: developers
        user:
          - leo
        action: member
        state: present

    # 4. Manage a Password Policy for the group
    - name: Ensure strict password policy for the 'developers' group
      freeipa.ansible_freeipa.ipapwpolicy:
        name: developers
        minlife: 24 # Minimum hours before password can be changed
        maxlife: 90 # Days before password expires
        minlength: 14 # Minimum password length
        maxfail: 5 # Lockout after 5 failed attempts
        state: present

    # 5. Manage a FreeIPA Host
    - name: Ensure host 'webserver01.homenet.lab' is present
      freeipa.ansible_freeipa.ipahost:
        name: webserver01.homenet.lab
        ip_address: 192.168.50.140
        state: present

    # 6. Manage Hostgroups (for grouping servers)
    - name: Ensure hostgroup 'webservers' exists
      freeipa.ansible_freeipa.ipahostgroup:
        name: webservers
        host:
          - webserver01.homenet.lab
        state: present

    # 7. Host-Based Access Control (HBAC)
    - name: Allow developers to SSH into webservers
      freeipa.ansible_freeipa.ipahbacrule:
        name: dev_ssh_web
        usergroup: developers
        hostgroup: webservers
        hbacsvc:
          - sshd
        state: present

    # 8. Sudo Rules
    - name: Ensure sudo command '/bin/systemctl restart nginx' exists
      freeipa.ansible_freeipa.ipasudocmd:
        name: /bin/systemctl restart nginx
        state: present

    - name: Allow developers to restart nginx on webservers
      freeipa.ansible_freeipa.ipasudorule:
        name: dev_nginx_restart
        usergroup: developers
        hostgroup: webservers
        allow_sudocmd:
          - /bin/systemctl restart nginx
        state: present

    # 9. DNS Management
    - name: Ensure a CNAME record exists for the web app
      freeipa.ansible_freeipa.ipadnsrecord:
        zone_name: "{{ ipa_domain }}"
        record_name: app
        record_type: CNAME
        record_value: webserver01.homenet.lab
        state: present
