- name: Configure VyOS
  hosts: spawned_vyos_vms
  gather_facts: false
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: vyos.vyos.vyos
    ansible_user: "vyos"
    ansible_password: "vyos"
    # network_cli (paramiko/libssh) ignores ansible_ssh_common_args
    ansible_host_key_checking: false
    pub_key: "{{ lookup('file', ssh_pub_key_file).split() }}"

  tasks:
    - name: End play if VM was already provisioned
      ansible.builtin.meta: end_host
      when: not is_fresh_install

    - name: System settings and static WAN address (DHCP address kept for now)
      no_log: true
      vyos.vyos.vyos_config:
        save: true
        lines:
          # - set interfaces ethernet eth0 address {{ wan_ip }}
          # - set protocols static route 0.0.0.0/0 next-hop {{ wan_gateway_ip }}
          - set system host-name {{ vm_name }}
          - set system time-zone {{ timezone }}
          - set service ntp server 0.pl.pool.ntp.org pool
          - set service ntp server 1.pl.pool.ntp.org pool
          - set system syslog local facility all level info
          - set system login user {{ admin_user }} authentication public-keys ansible type {{ pub_key[0] }}
          - set system login user {{ admin_user }} authentication public-keys ansible key {{ pub_key[1] }}
          - set system name-server {{ dns_servers[0] }}
          - set system name-server {{ dns_servers[1] }}

    - name: Interface addresses
      vyos.vyos.vyos_config:
        save: true
        lines:
          - set interfaces ethernet eth0 address {{ wan_ip }}
          - set protocols static route 0.0.0.0/0 next-hop {{ wan_gateway_ip }}
          # - set interfaces ethernet eth0 address fd50:cafe::253/64
          - set interfaces ethernet eth0 description WAN
          - set interfaces ethernet eth1 address {{ lan_ip }}
          - set interfaces ethernet eth1 description LAN

    - name: Switch connection to static WAN address
      ansible.builtin.set_fact:
        ansible_host: "{{ wan_address }}"

    - name: Reset connection
      ansible.builtin.meta: reset_connection

    # - name: DHCP for LAN
    #   vyos.vyos.vyos_config:
    #     save: true
    #     lines:
    #       - set service dhcp-server shared-network-name LAN subnet {{ lan_subnet }} subnet-id 1
    #       - set service dhcp-server shared-network-name LAN subnet {{ lan_subnet }} range 0 start 192.168.110.10
    #       - set service dhcp-server shared-network-name LAN subnet {{ lan_subnet }} range 0 stop 192.168.110.100
    #       - set service dhcp-server shared-network-name LAN subnet {{ lan_subnet }} lease 3600
    #       - set service dhcp-server shared-network-name LAN subnet {{ lan_subnet }} option default-router {{ lan_address }}
    #       - set service dhcp-server shared-network-name LAN subnet {{ lan_subnet }} option name-server {{ dns_servers[0] }}
    #       - set service dhcp-server shared-network-name LAN subnet {{ lan_subnet }} option name-server {{ dns_servers[1] }}

    - name: Masquerade LAN to WAN
      vyos.vyos.vyos_config:
        save: true
        lines:
          - set nat source rule 100 source address {{ lan_subnet }}
          - set nat source rule 100 outbound-interface name eth0
          - set nat source rule 100 translation address masquerade

    - name: SSH service
      vyos.vyos.vyos_config:
        save: true
        lines:
          - set service ssh port 22
          - set service ssh listen-address {{ wan_address }}
          - set service ssh listen-address {{ lan_address }}

    - name: Global options and groups
      vyos.vyos.vyos_config:
        save: true
        lines:
          # state-policy is applied before all chain rules
          - set firewall global-options all-ping enable
          - set firewall global-options state-policy established action accept
          - set firewall global-options state-policy related action accept
          - set firewall global-options state-policy invalid action drop
          - set firewall group network-group NET-WAN network 192.168.50.0/23
          - set firewall group network-group NET-WAN network 192.168.52.0/24
          - set firewall group network-group NET-LAN network {{ lan_subnet }}
          # Firewall input
          - set firewall ipv4 input filter default-action drop
          - set firewall ipv4 input filter default-log
          # ICMP echo-request
          - set firewall ipv4 input filter rule 10 action accept
          - set firewall ipv4 input filter rule 10 protocol icmp
          - set firewall ipv4 input filter rule 10 icmp type-name echo-request
          - set firewall ipv4 input filter rule 10 description 'Allow ping'
          # DHCP server request from LAN
          - set firewall ipv4 input filter rule 20 action accept
          - set firewall ipv4 input filter rule 20 protocol udp
          - set firewall ipv4 input filter rule 20 destination port 67
          - set firewall ipv4 input filter rule 20 inbound-interface name eth1
          - set firewall ipv4 input filter rule 20 description 'Allow DHCP from LAN'
          # NetBIOS from WAN
          - set firewall ipv4 input filter rule 30 action accept
          - set firewall ipv4 input filter rule 30 protocol udp
          - set firewall ipv4 input filter rule 30 destination port 137,138
          - set firewall ipv4 input filter rule 30 inbound-interface name eth0
          - set firewall ipv4 input filter rule 30 description 'Allow NetBIOS from WAN'
          # SSH to WAN IP
          - set firewall ipv4 input filter rule 40 action accept
          - set firewall ipv4 input filter rule 40 protocol tcp
          - set firewall ipv4 input filter rule 40 destination address {{ wan_address }}
          - set firewall ipv4 input filter rule 40 destination port 22
          - set firewall ipv4 input filter rule 40 inbound-interface name eth0
          - set firewall ipv4 input filter rule 40 description 'Allow SSH from WAN'
          # SSH from LAN
          - set firewall ipv4 input filter rule 45 action accept
          - set firewall ipv4 input filter rule 45 protocol tcp
          - set firewall ipv4 input filter rule 45 destination port 22
          - set firewall ipv4 input filter rule 45 inbound-interface name eth1
          - set firewall ipv4 input filter rule 45 description 'Allow SSH from LAN'

    - name: IPv4 forward filter
      vyos.vyos.vyos_config:
        save: true
        lines:
          - set firewall ipv4 forward filter default-action drop
          - set firewall ipv4 forward filter default-log
          # Inbound from WAN subnets to LAN
          - set firewall ipv4 forward filter rule 100 action accept
          - set firewall ipv4 forward filter rule 100 inbound-interface name eth0
          - set firewall ipv4 forward filter rule 100 outbound-interface name eth1
          - set firewall ipv4 forward filter rule 100 source group network-group NET-WAN
          - set firewall ipv4 forward filter rule 100 destination group network-group NET-LAN
          - set firewall ipv4 forward filter rule 100 description 'Allow WAN subnets to LAN'
          # Outbound from LAN to WAN
          - set firewall ipv4 forward filter rule 110 action accept
          - set firewall ipv4 forward filter rule 110 inbound-interface name eth1
          - set firewall ipv4 forward filter rule 110 outbound-interface name eth0
          - set firewall ipv4 forward filter rule 110 source group network-group NET-LAN
          - set firewall ipv4 forward filter rule 110 description 'Allow LAN to   WAN'
          # Output
          - set firewall ipv4 output filter default-action accept

    - name: IPv6 filters
      vyos.vyos.vyos_config:
        save: true
        lines:
          - set firewall ipv6 input filter default-action drop
          - set firewall ipv6 forward filter default-action drop
          # ICMPv6 is required for neighbor discovery
          - set firewall ipv6 input filter rule 10 action accept
          - set firewall ipv6 input filter rule 10 protocol ipv6-icmp
          - set firewall ipv6 input filter rule 10 description 'Allow ICMPv6 (ND, ping)'

    # Last step: drop the temporary DHCP address (we are connected via the static IP)
    - name: Remove DHCP address from eth0
      vyos.vyos.vyos_config:
        save: true
        lines:
          - delete interfaces ethernet eth0 address dhcp
          - delete system login user vyos
