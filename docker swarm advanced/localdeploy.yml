---
- name: Deploy KVM VMs using local Debian image
  hosts: localhost
  become: true
  vars:
    # Number of worker VMs to provision (managers are node01, node02, node03; workers start at node04)
    # Values marked &name are reused by the teardown play via *name
    num_workers: &num_workers 3
    num_managers: &num_managers 3 # Must be odd (1, 3, 5…); first num_managers nodes become swarm managers

    # VM naming — nodes are named <vm_name_prefix><zero-padded index>
    vm_name_prefix: &vm_name_prefix "mskladb13dswm"

    # Starting IP — node01 gets this IP, last octet incremented per node (180 → node01 .180, node02 .181, …)
    vm_ip_base: "192.168.50.181"
    vm_ip_subnet: "/23"

    # Managers VM resources
    manager_disk_size: "32G"
    manager_vm_vcpus: 4
    manager_vm_memory_kb: 2097152 # 2048 MB

    # Workers VM resources
    worker_disk_size: "16G"
    worker_vm_vcpus: 2
    worker_vm_memory_kb: 1048576 # 1024 MB

    # vms list is built dynamically in pre_tasks below
    vms: []

    admin_user: "madmin"
    ssh_pub_key_file: "/home/madmin/.ssh/ansible.pub"
    vm_autostart: false
    gateway_ip: "192.168.50.250"
    dns_servers:
      - "192.168.50.242"
      - "192.168.50.250"

    disk_dir: &disk_dir "/data/VMS"
    template_image_path: "/data/ISO/VMIMAGES/KVM/debian13withuefi.qcow2"
    uefi_code_path: "{{ '/usr/share/OVMF/OVMF_CODE_4M.fd' if ansible_os_family == 'Debian' else '/usr/share/edk2/ovmf/OVMF_CODE.fd' }}"
    uefi_vars_template_path: "{{ '/usr/share/OVMF/OVMF_VARS_4M.fd' if ansible_os_family == 'Debian' else '/usr/share/edk2/ovmf/OVMF_VARS.fd' }}"
    emulator_path: "{{ '/usr/bin/qemu-system-x86_64' if ansible_os_family == 'Debian' else '/usr/libexec/qemu-kvm' }}"

  pre_tasks:
    - name: Validate sizing and IP range
      ansible.builtin.assert:
        that:
          - num_managers | int >= 1
          - num_managers | int is odd
          - num_workers | int >= 0
          - vm_ip_base.split('.') | length == 4

    - name: Build dynamic VM list from num_workers
      ansible.builtin.set_fact:
        vms: >-
          {{
            vms + [{
              'vm_name': vm_name_prefix ~ ('%02d' | format(idx + 1)),
              'static_ip': (vm_ip_base.split('.')[:3] | join('.')) ~ '.' ~
                           (((vm_ip_base.split('.')[3] | int) + idx) | string) ~ vm_ip_subnet,
              'disk_size':    manager_disk_size    if idx < num_managers else worker_disk_size,
              'vm_vcpus':     manager_vm_vcpus     if idx < num_managers else worker_vm_vcpus,
              'vm_memory_kb': manager_vm_memory_kb if idx < num_managers else worker_vm_memory_kb
            }]
          }}
      loop: "{{ range(0, num_managers + num_workers) | list }}"
      loop_control:
        loop_var: idx

  tasks:
    - name: Ensure required packages are installed (RedHat/CentOS/Fedora)
      ansible.builtin.package:
        name:
          - python3-libvirt
          - qemu-img
          - libvirt-client
          - edk2-ovmf
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Ensure UEFI firmware is installed (Debian/Ubuntu)
      ansible.builtin.package:
        name:
          - python3-libvirt
          - qemu-utils
          - libvirt-clients
          - ovmf
        state: present
      when: ansible_os_family == 'Debian'

    - name: Ensure libvirt UEFI NVRAM directory exists
      ansible.builtin.file:
        path: /var/lib/libvirt/qemu/nvram
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure target disk directory exists
      ansible.builtin.file:
        path: "{{ disk_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Check if VM domains exist in libvirt
      ansible.builtin.command: "virsh dominfo {{ item.vm_name }}"
      register: virsh_dominfo
      loop: "{{ vms }}"
      failed_when: false
      changed_when: false

    - name: Record fresh install status per VM
      ansible.builtin.set_fact:
        is_fresh_install_map: "{{ is_fresh_install_map | default({}) | combine({item.item.vm_name: (item.rc != 0)}) }}"
      loop: "{{ virsh_dominfo.results }}"

    - name: End play early if all VMs are already provisioned
      when: "true not in is_fresh_install_map.values() | list"
      block:
        - name: Display already provisioned message
          ansible.builtin.debug:
            msg: "All VMs ({{ is_fresh_install_map.keys() | list | join(', ') }}) are already defined in libvirt. Nothing to provision."
        - name: End play
          ansible.builtin.meta: end_play

    - name: Check if destination images already exist
      ansible.builtin.stat:
        path: "{{ disk_dir }}/{{ item.vm_name }}.qcow2"
      loop: "{{ vms }}"
      register: destination_disks

    - name: Create standalone VM disks from local template
      ansible.builtin.copy:
        src: "{{ template_image_path }}"
        dest: "{{ disk_dir }}/{{ item.item.vm_name }}.qcow2"
        remote_src: true
        force: false
        owner: root
        group: root
        mode: "0644"
      loop: "{{ destination_disks.results }}"
      when: not item.stat.exists

    - name: Resize the images to desired disk size
      ansible.builtin.command: "qemu-img resize {{ disk_dir }}/{{ item.item.vm_name }}.qcow2 {{ item.item.disk_size }}"
      register: resize_output
      changed_when: not item.stat.exists
      loop: "{{ destination_disks.results }}"
      when: not item.stat.exists

    - name: Defining Virtual Machine using XML
      community.libvirt.virt:
        command: define
        xml: |
          <domain type='kvm'>
            <name>{{ item.vm_name }}</name>
            <memory unit='KiB'>{{ item.vm_memory_kb }}</memory>
            <currentMemory unit='KiB'>{{ item.vm_memory_kb }}</currentMemory>
            <description>VM provisioned by Ansible</description>
            <vcpu placement='static'>{{ item.vm_vcpus }}</vcpu>
            <cpu mode='host-passthrough' check='none'>
              <topology sockets='1' dies='1' clusters='1' cores='{{ item.vm_vcpus }}' threads='1'/>
              <feature policy='require' name='vmx'/>
            </cpu>
            <os>
              <type arch='x86_64' machine='q35'>hvm</type>
              <loader readonly='yes' secure='no' type='pflash' format='raw'>{{ uefi_code_path }}</loader>
              <nvram template='{{ uefi_vars_template_path }}' templateFormat='raw' format='raw'>/var/lib/libvirt/qemu/nvram/{{ item.vm_name }}_VARS.fd</nvram>
              <boot dev='hd'/>
              <bootmenu enable='no'/>
            </os>
            <on_poweroff>destroy</on_poweroff>
            <on_reboot>restart</on_reboot>
            <on_crash>destroy</on_crash>
            <features>
              <acpi/>
              <apic/>
              <smm state='on'/>
              <ioapic driver='kvm'/>
            </features>
            <clock offset='utc'>
              <timer name='rtc' tickpolicy='catchup'/>
              <timer name='pit' tickpolicy='delay'/>
              <timer name='hpet' present='no'/>
            </clock>
            <pm>
              <suspend-to-mem enabled='no'/>
              <suspend-to-disk enabled='no'/>
            </pm>
            <devices>
              <emulator>{{ emulator_path }}</emulator>
              <disk type='file' device='disk'>
                <driver name='qemu' type='qcow2' cache='writeback'/>
                <source file='{{ disk_dir }}/{{ item.vm_name }}.qcow2'/>
                <target dev='vda' bus='virtio'/>
              </disk>
              <interface type='bridge'>
                <source bridge='br0'/>
                <model type='virtio'/>
                <link state='up'/>
              </interface>
              <controller type='virtio-serial' index='0'/>
              <channel type='unix'>
                <source mode='bind'/>
                <target type='virtio' name='org.qemu.guest_agent.0'/>
                <address type='virtio-serial' controller='0' bus='0' port='1'/>
              </channel>
              <serial type='pty'>
                <target type='isa-serial' port='0'>
                  <model name='isa-serial'/>
                </target>
              </serial>
              <console type='pty'>
                <target type='serial' port='0'/>
              </console>
              <input type='mouse' bus='ps2'/>
              <input type='keyboard' bus='ps2'/>
              <graphics type='vnc' port='-1' autoport='yes' listen='127.0.0.1'/>
            </devices>
          </domain>
      loop: "{{ vms }}"
      when: is_fresh_install_map[item.vm_name]

    - name: Configure VM autostart
      community.libvirt.virt:
        name: "{{ item.vm_name }}"
        autostart: "{{ vm_autostart }}"
      loop: "{{ vms }}"

    - name: Ensure VMs are started
      community.libvirt.virt:
        name: "{{ item.vm_name }}"
        state: running
      loop: "{{ vms }}"
      loop_control:
        pause: 5

    - name: Ensure guest agent is responding
      ansible.builtin.command: "virsh -c qemu:///system guestinfo {{ item.vm_name }}"
      register: agent_ready
      until: agent_ready.rc == 0
      retries: 20
      delay: 3
      changed_when: false
      loop: "{{ vms }}"

    - name: Add new VMs to dynamic inventory
      ansible.builtin.add_host:
        name: "{{ item.vm_name }}"
        groups:
          - spawned_vms
          - "{{ 'swarm_managers' if loop_idx < num_managers else 'swarm_workers' }}"
        vm_name: "{{ item.vm_name }}"
        static_ip: "{{ item.static_ip }}"
        dns_servers: "{{ dns_servers }}"
        gateway_ip: "{{ gateway_ip }}"
        ansible_connection: community.libvirt.libvirt_qemu
        ansible_libvirt_uri: "qemu:///system"
        ansible_libvirt_vm: "{{ item.vm_name }}"
        ansible_user: "root"
        admin_user: "{{ admin_user }}"
        ssh_pub_key_file: "{{ ssh_pub_key_file }}"
        is_fresh_install: "{{ is_fresh_install_map[item.vm_name] }}"
      loop: "{{ vms }}"
      loop_control:
        loop_var: item
        index_var: loop_idx

- name: Provision, configure, and install Docker on spawned VMs sequentially
  hosts: spawned_vms
  serial: 1
  gather_facts: true
  tasks:
    - name: Wait for system to become reachable
      ansible.builtin.wait_for_connection:
        delay: 1
        sleep: 5
        timeout: 30

    - name: Skip host — already provisioned
      ansible.builtin.meta: end_host
      when: not is_fresh_install

    - name: Expand root partition and filesystem
      ansible.builtin.shell: |
        ROOT_PART=$(findmnt -n -o SOURCE /)
        ROOT_DEV=$(echo "$ROOT_PART" | sed 's/p\?[0-9]*$//')
        ROOT_PART_NUM=$(echo "$ROOT_PART" | grep -o '[0-9]*$')
        growpart "$ROOT_DEV" "$ROOT_PART_NUM"
        FS_TYPE=$(findmnt -n -o FSTYPE /)
        if [ "$FS_TYPE" = "xfs" ]; then
          xfs_growfs /
        else
          resize2fs "$ROOT_PART"
        fi
      args:
        executable: /bin/bash
      register: growpart_result
      changed_when: "'CHANGED' in growpart_result.stdout"
      failed_when: "growpart_result.rc != 0 and 'NOCHANGE' not in growpart_result.stdout"

    - name: Set hostname to '{{ vm_name }}'
      ansible.builtin.hostname:
        name: "{{ vm_name }}"

    - name: Add all cluster VM hostnames and IPs to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^{{ hostvars[item]['static_ip'].split('/')[0] | regex_escape }}\\s+"
        line: "{{ hostvars[item]['static_ip'].split('/')[0] }} {{ hostvars[item]['vm_name'] }}"
        state: present
      loop: "{{ groups['spawned_vms'] }}"

    # - name: Configure GRUB kernel cmdline for serial console
    #   ansible.builtin.lineinfile:
    #     path: /etc/default/grub
    #     regexp: '^GRUB_CMDLINE_LINUX='
    #     line: 'GRUB_CMDLINE_LINUX="console=tty1 console=ttyS0,115200n8"'
    #     backrefs: no
    #   register: grub_serial_console
    #   become: yes

    # - name: Rebuild grub config on Debian family
    #   ansible.builtin.command: update-grub
    #   when:
    #     - ansible_os_family == 'Debian'
    #     - grub_serial_console.changed
    #   become: yes

    # - name: Rebuild grub config on RedHat family
    #   ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
    #   when:
    #     - ansible_os_family == 'RedHat'
    #     - grub_serial_console.changed
    #   become: yes

    # - name: Enable serial getty on ttyS0
    #   ansible.builtin.systemd:
    #     name: serial-getty@ttyS0.service
    #     enabled: true
    #     state: started
    #   become: true

    - name: Ensure the user admin exists
      ansible.builtin.user:
        name: "{{ admin_user }}"
        group: users
        groups: "{{ (ansible_os_family == 'Debian') | ternary('sudo', 'wheel') }}"
        append: true
        state: present
        create_home: true
        shell: /bin/bash
        update_password: on_create
        password: "{{ lookup('ansible.builtin.password', '/dev/null length=32') | password_hash('sha512') }}"

    - name: Create ssh directory
      ansible.builtin.file:
        path: "/home/{{ admin_user }}/.ssh"
        state: directory
        owner: "{{ admin_user }}"
        group: users
        mode: "0700"

    - name: Add SSH public key for admin user
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        state: present
        key: "{{ lookup('file', ssh_pub_key_file) }}"

    # - name: Remove default cloud users if they exist
    #   ansible.builtin.user:
    #     name: "{{ item }}"
    #     state: absent
    #     remove: yes
    #   become: true
    #   loop:
    #     - ubuntu
    #     - debian
    #   when: item != admin_user

    - name: Configure passwordless sudo for admin user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL"
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

- name: Configure static IP using systemd-networkd
  hosts: spawned_vms
  gather_facts: false
  tasks:
    - name: Skip host — already provisioned
      ansible.builtin.meta: end_host
      when: not is_fresh_install

    - name: Purge existing systemd-networkd configuration directory
      ansible.builtin.file:
        path: /etc/systemd/network
        state: absent

    - name: Ensure clean systemd-networkd directory exists
      ansible.builtin.file:
        path: /etc/systemd/network
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure static IP in systemd-networkd
      ansible.builtin.copy:
        dest: /etc/systemd/network/10-static.network
        content: |
          [Match]
          Name=e*

          [Network]
          Address={{ static_ip }}
          {% for dns in dns_servers %}
          DNS={{ dns }}
          {% endfor %}

          IPv6AcceptRA=no

          [Route]
          Destination=0.0.0.0/0
          Gateway={{ gateway_ip }}
          GatewayOnLink=yes
          Metric=10
        owner: root
        group: root
        mode: "0644"

    - name: Restart systemd-networkd to apply static IP configuration
      ansible.builtin.systemd:
        name: systemd-networkd
        enabled: true
        state: restarted

    - name: Display VM Hostname and IP address summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - " VM Provisioning Summary"
          - " Hostname: {{ vm_name }}"
          - " Configured IP: {{ static_ip }}"
          - "=========================================="

- name: Update and install baseline tools on the spawned VMs
  hosts: spawned_vms
  serial: 1
  gather_facts: false
  tasks:
    - name: Skip host — already provisioned
      ansible.builtin.meta: end_host
      when: not is_fresh_install

    - name: Upgrade all installed packages
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
      # become: yes (Not needed: Agent connection is already root-privileged)

    - name: Ensure baseline tools are installed
      ansible.builtin.package:
        name:
          - git
          - htop
          - curl
          - wget
          - gnupg
        state: present

    # -------------------------------------------------------------------------
    # Docker Service Installation
    # -------------------------------------------------------------------------
    # - name: Ensure prerequisite packages are installed
    #   ansible.builtin.apt:
    #     name:
    #       - ca-certificates
    #       - curl
    #       - gnupg
    #     state: present
    #     update_cache: yes

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Configure Docker official APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Install Docker Engine and plugins
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - python3-docker
        state: present
        update_cache: yes

    - name: Ensure Docker service is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add admin user to docker group
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: docker
        append: yes
      when: admin_user is defined

    - name: Configure sysctl settings
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/10-kubernetes.conf
        reload: true
      loop: "{{ sysctl_settings | dict2items }}"
      vars:
        sysctl_settings:
          net.ipv4.ip_forward: 1
          net.core.rmem_max: 262144
          net.core.wmem_max: 262144
          net.ipv4.tcp_rmem: "4096 87380 33554432"
          net.ipv4.tcp_wmem: "4096 65536 33554432"
          net.ipv4.ip_unprivileged_port_start: 80
          vm.swappiness: 10
          kernel.keys.maxbytes: 2000000
          kernel.keys.maxkeys: 2000
          vm.max_map_count: 262144

    - name: Reload sysctl settings
      ansible.builtin.command: sysctl --system

    # - name: Reboot VM to apply changes
    #   ansible.builtin.command: systemctl reboot
    #   async: 1
    #   poll: 0
    #   changed_when: true
    #   become: true

    # - name: Wait for VM to become reachable after reboot
    #   ansible.builtin.wait_for_connection:
    #     delay: 10
    #     sleep: 5
    #     timeout: 60

- name: Initialize Docker Swarm on first manager (node01)
  hosts: "{{ (groups['swarm_managers'] | default([]))[:1] }}"
  gather_facts: false
  tasks:
    - name: Skip host — already provisioned
      ansible.builtin.meta: end_host
      when: not is_fresh_install

    - name: Extract node IP address
      ansible.builtin.set_fact:
        node_ip: "{{ static_ip.split('/')[0] }}"

    - name: Initialize Swarm cluster
      community.docker.docker_swarm:
        state: present
        advertise_addr: "{{ node_ip }}"
      register: swarm_info

- name: Join additional managers to Docker Swarm
  hosts: "{{ (groups['swarm_managers'] | default([]))[1:] }}"
  serial: 1
  gather_facts: false
  tasks:
    - name: Skip host — already provisioned
      ansible.builtin.meta: end_host
      when: not is_fresh_install

    - name: Extract node IP address
      ansible.builtin.set_fact:
        node_ip: "{{ static_ip.split('/')[0] }}"

    - name: Join Swarm cluster as manager
      community.docker.docker_swarm:
        state: join
        advertise_addr: "{{ node_ip }}"
        join_token: "{{ hostvars[groups['swarm_managers'][0]]['swarm_info']['swarm_facts']['JoinTokens']['Manager'] }}"
        remote_addrs:
          - "{{ hostvars[groups['swarm_managers'][0]]['node_ip'] }}:2377"

- name: Save Docker Swarm tokens (all manager IPs now known)
  hosts: "{{ (groups['swarm_managers'] | default([]))[:1] }}"
  gather_facts: false
  tasks:
    - name: Write tokens file with all manager IPs
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/jointoken.yml"
        content: |
          # Docker Swarm Cluster Tokens
          docker_swarm_manager_ips:
          {% for mgr in groups['swarm_managers'] %}
            - "{{ hostvars[mgr]['node_ip'] }}"
          {% endfor %}
          docker_swarm_worker_token: "{{ swarm_info.swarm_facts.JoinTokens.Worker }}"
          docker_swarm_manager_token: "{{ swarm_info.swarm_facts.JoinTokens.Manager }}"
        mode: "0600"
      delegate_to: localhost
      become: false

- name: Join Worker nodes to Docker Swarm
  hosts: swarm_workers
  serial: 1
  gather_facts: false
  tasks:
    - name: Skip host — already provisioned
      ansible.builtin.meta: end_host
      when: not is_fresh_install

    - name: Extract worker IP address
      ansible.builtin.set_fact:
        node_ip: "{{ static_ip.split('/')[0] }}"

    - name: Join Swarm cluster as worker
      community.docker.docker_swarm:
        state: join
        advertise_addr: "{{ node_ip }}"
        join_token: "{{ hostvars[groups['swarm_managers'][0]]['swarm_info']['swarm_facts']['JoinTokens']['Worker'] }}"
        remote_addrs:
          - "{{ hostvars[groups['swarm_managers'][0]]['node_ip'] }}:2377"

- name: Verify Docker Swarm cluster status
  hosts: swarm_managers
  gather_facts: false
  tasks:
    - name: Retrieve cluster node list
      ansible.builtin.command: docker node ls
      register: docker_node_ls
      changed_when: false

    - name: Display Swarm cluster nodes
      ansible.builtin.debug:
        var: docker_node_ls.stdout_lines

- name: Show VM status (only run when explicitly requested with --tags status)
  hosts: localhost
  become: true
  gather_facts: false
  tags:
    - never
    - status
  vars:
    num_managers: *num_managers
    num_workers: *num_workers
    vm_name_prefix: *vm_name_prefix
    status_vm_names: []
  pre_tasks:
    - name: Build VM names for status
      ansible.builtin.set_fact:
        status_vm_names: "{{ status_vm_names + [vm_name_prefix ~ ('%02d' | format(idx + 1))] }}"
      loop: "{{ range(0, num_managers + num_workers) | list }}"
      loop_control:
        loop_var: idx
  tasks:
    - name: Query VM state
      ansible.builtin.command: "virsh -c qemu:///system domstate {{ item }}"
      register: status_info
      loop: "{{ status_vm_names }}"
      failed_when: false
      changed_when: false

    - name: Display VM status table
      ansible.builtin.debug:
        msg: "{{ table.splitlines() }}"
      vars:
        table: |
          {% set rows = [] %}
          {% for r in status_info.results %}
          {% set _ = rows.append([r.item, ('manager' if loop.index0 < num_managers else 'worker'), (r.stdout | trim if r.rc == 0 else 'not defined')]) %}
          {% endfor %}
          {% set w1 = (['VM' | length] + (rows | map(attribute=0) | map('length') | list)) | max %}
          {% set w2 = (['Role' | length] + (rows | map(attribute=1) | map('length') | list)) | max %}
          {% set w3 = (['State' | length] + (rows | map(attribute=2) | map('length') | list)) | max %}
          {% set sep = '+-' ~ '-' * w1 ~ '-+-' ~ '-' * w2 ~ '-+-' ~ '-' * w3 ~ '-+' %}
          {{ sep }}
          | {{ 'VM'.ljust(w1) }} | {{ 'Role'.ljust(w2) }} | {{ 'State'.ljust(w3) }} |
          {{ sep }}
          {% for row in rows %}
          | {{ row[0].ljust(w1) }} | {{ row[1].ljust(w2) }} | {{ row[2].ljust(w3) }} |
          {% endfor %}
          {{ sep }}

- name: Start VMs (only run when explicitly requested with --tags startup)
  hosts: localhost
  become: true
  gather_facts: false
  tags:
    - never
    - startup
  vars:
    num_managers: *num_managers
    num_workers: *num_workers
    vm_name_prefix: *vm_name_prefix
    startup_vm_names: []
  pre_tasks:
    - name: Build VM names for start
      ansible.builtin.set_fact:
        startup_vm_names: "{{ startup_vm_names + [vm_name_prefix ~ ('%02d' | format(idx + 1))] }}"
      loop: "{{ range(0, num_managers + num_workers) | list }}"
      loop_control:
        loop_var: idx
  tasks:
    - name: Check which VM domains exist
      ansible.builtin.command: "virsh -c qemu:///system domstate {{ item }}"
      register: startup_domain_info
      loop: "{{ startup_vm_names }}"
      failed_when: false
      changed_when: false

    - name: Request start of existing VMs
      ansible.builtin.command: "virsh -c qemu:///system start {{ item.item }}"
      loop: "{{ startup_domain_info.results }}"
      when: item.rc == 0 and 'running' not in item.stdout
      register: startup
      failed_when: "startup.rc != 0 and 'running' not in startup.stderr | lower"
      changed_when: startup.rc == 0
      loop_control:
        pause: 5

    - name: Wait for existing VMs to startup
      ansible.builtin.command: "virsh -c qemu:///system domstate {{ item.item }}"
      loop: "{{ startup_domain_info.results }}"
      when: item.rc == 0 and 'running' not in item.stdout
      register: startup_vm_state
      until: "'running' in startup_vm_state.stdout | lower"
      retries: 30
      delay: 5
      changed_when: false


- name: Shutdown VMs (only run when explicitly requested with --tags shutdown)
  hosts: localhost
  become: true
  gather_facts: false
  tags:
    - never
    - shutdown
  vars:
    num_managers: *num_managers
    num_workers: *num_workers
    vm_name_prefix: *vm_name_prefix
    shutdown_vm_names: []
  pre_tasks:
    - name: Build VM names for shutdown
      ansible.builtin.set_fact:
        shutdown_vm_names: "{{ shutdown_vm_names + [vm_name_prefix ~ ('%02d' | format(idx + 1))] }}"
      loop: "{{ range(0, num_managers + num_workers) | list }}"
      loop_control:
        loop_var: idx
  tasks:
    - name: Check which VM domains exist
      ansible.builtin.command: "virsh -c qemu:///system dominfo {{ item }}"
      register: shutdown_domain_info
      loop: "{{ shutdown_vm_names }}"
      failed_when: false
      changed_when: false

    - name: Request graceful shutdown of existing VMs
      ansible.builtin.command: "virsh -c qemu:///system shutdown {{ item.item }}"
      loop: "{{ shutdown_domain_info.results }}"
      when: item.rc == 0 and 'shut off' not in item.stdout
      register: shutdown
      failed_when: "shutdown.rc != 0 and 'not running' not in shutdown.stderr | lower"
      changed_when: shutdown.rc == 0
      loop_control:
        pause: 3

    - name: Wait for existing VMs to shut down
      ansible.builtin.command: "virsh -c qemu:///system domstate {{ item.item }}"
      loop: "{{ shutdown_domain_info.results }}"
      when: item.rc == 0 and 'shut off' not in item.stdout
      register: shutdown_vm_state
      until: "'shut off' in shutdown_vm_state.stdout | lower"
      retries: 30
      delay: 3
      changed_when: false

- name: Tear down VMs (only run when explicitly requested with --tags teardown)
  hosts: localhost
  become: true
  gather_facts: false
  tags:
    - never
    - teardown
  vars:
    num_managers: *num_managers
    num_workers: *num_workers
    vm_name_prefix: *vm_name_prefix
    disk_dir: *disk_dir
    teardown_vm_names: []
    teardown_storage_paths: []
    uefi_nvram_dir: "/var/lib/libvirt/qemu/nvram"
  pre_tasks:
    - name: Build VM names for teardown
      ansible.builtin.set_fact:
        teardown_vm_names: "{{ teardown_vm_names + [vm_name_prefix ~ ('%02d' | format(idx + 1))] }}"
      loop: "{{ range(0, num_managers + num_workers) | list }}"
      loop_control:
        loop_var: idx

    - name: Build VM storage paths for teardown
      ansible.builtin.set_fact:
        teardown_storage_paths: >-
          {{ teardown_storage_paths + [
            disk_dir ~ '/' ~ item ~ '.qcow2',
            uefi_nvram_dir ~ '/' ~ item ~ '_VARS.fd'
          ] }}
      loop: "{{ teardown_vm_names }}"
  tasks:
    - name: Check which VM domains exist
      ansible.builtin.command: "virsh -c qemu:///system dominfo {{ item }}"
      register: teardown_domain_info
      loop: "{{ teardown_vm_names }}"
      failed_when: false
      changed_when: false

    - name: Request graceful shutdown of existing VMs
      ansible.builtin.command: "virsh -c qemu:///system shutdown {{ item.item }}"
      loop: "{{ teardown_domain_info.results }}"
      when: item.rc == 0 and 'shut off' not in item.stdout
      register: teardown_shutdown
      failed_when: "teardown_shutdown.rc != 0 and 'not running' not in teardown_shutdown.stderr | lower"
      changed_when: teardown_shutdown.rc == 0
      loop_control:
        pause: 5

    - name: Wait for existing VMs to shut down
      ansible.builtin.command: "virsh -c qemu:///system domstate {{ item.item }}"
      loop: "{{ teardown_domain_info.results }}"
      when: item.rc == 0 and 'shut off' not in item.stdout
      register: teardown_vm_state
      until: "'shut off' in teardown_vm_state.stdout | lower"
      retries: 30
      delay: 5
      changed_when: false

    - name: Undefine existing VMs
      ansible.builtin.command: "virsh -c qemu:///system undefine {{ item.item }} --remove-all-storage --nvram --managed-save --snapshots-metadata"
      loop: "{{ teardown_domain_info.results }}"
      when: item.rc == 0
      register: teardown_undefine
      failed_when: "teardown_undefine.rc != 0 and 'domain not found' not in teardown_undefine.stderr | lower"
      changed_when: teardown_undefine.rc == 0
      loop_control:
        pause: 1

    - name: Remove leftover VM storage and NVRAM files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ teardown_storage_paths }}"

