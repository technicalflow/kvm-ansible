---
- name: Deploy MicroK8S KVM VMs using local Debian image
  hosts: localhost
  become: true
  vars:
    # List of 3 virtual machines to provision
    vms:
      - vm_name: "mskladb13mk8s01"
        static_ip: "192.168.50.176/23"
      - vm_name: "mskladb13mk8s02"
        static_ip: "192.168.50.177/23"
      - vm_name: "mskladb13mk8s03"
        static_ip: "192.168.50.178/23"

    vm_memory_kb: 2097152 # 2048 MB each
    vm_vcpus: 4
    disk_size: "32G"
    admin_user: "madmin"
    ssh_pub_key_file: "/home/madmin/.ssh/ansible.pub"
    vm_autostart: false
    gateway_ip: "192.168.50.250"
    dns_servers:
      - "192.168.50.242"
      - "192.168.50.250"

    template_image_path: "/data/ISO/VMIMAGES/KVM/debian13withuefi.qcow2"
    uefi_code_path: "{{ '/usr/share/OVMF/OVMF_CODE_4M.fd' if ansible_os_family == 'Debian' else '/usr/share/edk2/ovmf/OVMF_CODE.fd' }}"
    uefi_vars_template_path: "{{ '/usr/share/OVMF/OVMF_VARS_4M.fd' if ansible_os_family == 'Debian' else '/usr/share/edk2/ovmf/OVMF_VARS.fd' }}"
    emulator_path: "{{ '/usr/bin/qemu-system-x86_64' if ansible_os_family == 'Debian' else '/usr/libexec/qemu-kvm' }}"

  tasks:
    - name: Ensure required packages are installed (RedHat/CentOS/Fedora)
      ansible.builtin.package:
        name:
          - python3-libvirt
          - qemu-img
          - libvirt-client
          - edk2-ovmf
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Ensure UEFI firmware is installed (Debian/Ubuntu)
      ansible.builtin.package:
        name:
          - python3-libvirt
          - qemu-utils
          - libvirt-clients
          - ovmf
        state: present
      when: ansible_os_family == 'Debian'

    - name: Ensure libvirt UEFI NVRAM directory exists
      ansible.builtin.file:
        path: /var/lib/libvirt/qemu/nvram
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure target disk directory exists
      ansible.builtin.file:
        path: /nvme/vms
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Check if VM domains exist in libvirt
      ansible.builtin.command: "virsh -c qemu:///system dominfo {{ item.vm_name }}"
      register: virsh_dominfo
      loop: "{{ vms }}"
      failed_when: false
      changed_when: false

    - name: Record fresh install status per VM
      ansible.builtin.set_fact:
        is_fresh_install_map: "{{ is_fresh_install_map | default({}) | combine({item.item.vm_name: (item.rc != 0)}) }}"
      loop: "{{ virsh_dominfo.results }}"

    - name: End play early if all VMs are already provisioned
      when: "true not in is_fresh_install_map.values() | list"
      block:
        - name: Display already provisioned message
          ansible.builtin.debug:
            msg: "All VMs ({{ is_fresh_install_map.keys() | list | join(', ') }}) are already defined in libvirt. Nothing to provision."
        - name: End play
          ansible.builtin.meta: end_play

    - name: Check if destination images already exist
      ansible.builtin.stat:
        path: "/nvme/vms/{{ item.vm_name }}.qcow2"
      loop: "{{ vms }}"
      register: destination_disks

    - name: Create standalone VM disks from local template
      ansible.builtin.copy:
        src: "{{ template_image_path }}"
        dest: "/nvme/vms/{{ item.item.vm_name }}.qcow2"
        remote_src: true
        force: false
        owner: root
        group: root
        mode: "0644"
      loop: "{{ destination_disks.results }}"
      when: not item.stat.exists

    - name: Resize the images to desired disk size
      ansible.builtin.command: "qemu-img resize /nvme/vms/{{ item.item.vm_name }}.qcow2 {{ disk_size }}"
      register: resize_output
      changed_when: not item.stat.exists
      loop: "{{ destination_disks.results }}"
      when: not item.stat.exists

    - name: Ensure guest agent is enabled in XML
      community.libvirt.virt:
        command: define
        xml: |
          <domain type='kvm'>
            <name>{{ item.vm_name }}</name>
            <memory unit='KiB'>{{ vm_memory_kb }}</memory>
            <currentMemory unit='KiB'>{{ vm_memory_kb }}</currentMemory>
            <description>VM provisioned by Ansible</description>
            <vcpu placement='static'>{{ vm_vcpus }}</vcpu>
            <cpu mode='host-passthrough' check='none'>
              <topology sockets='1' dies='1' clusters='1' cores='{{ vm_vcpus }}' threads='1'/>
              <feature policy='require' name='vmx'/>
            </cpu>
            <os>
              <type arch='x86_64' machine='q35'>hvm</type>
              <loader readonly='yes' secure='no' type='pflash' format='raw'>{{ uefi_code_path }}</loader>
              <nvram template='{{ uefi_vars_template_path }}' templateFormat='raw' format='raw'>/var/lib/libvirt/qemu/nvram/{{ item.vm_name }}_VARS.fd</nvram>
              <boot dev='hd'/>
              <bootmenu enable='no'/>
            </os>
            <on_poweroff>destroy</on_poweroff>
            <on_reboot>restart</on_reboot>
            <on_crash>destroy</on_crash>
            <features>
              <acpi/>
              <apic/>
              <smm state='on'/>
              <ioapic driver="kvm"/>
            </features>
            <clock offset='utc'>
              <timer name='rtc' tickpolicy='catchup'/>
              <timer name='pit' tickpolicy='delay'/>
              <timer name='hpet' present='no'/>
            </clock>
            <pm>
              <suspend-to-mem enabled='no'/>
              <suspend-to-disk enabled='no'/>
            </pm>
            <devices>
              <emulator>{{ emulator_path }}</emulator>
              <disk type='file' device='disk'>
                <driver name='qemu' type='qcow2' cache='writeback'/>
                <source file='/nvme/vms/{{ item.vm_name }}.qcow2'/>
                <target dev='vda' bus='virtio'/>
              </disk>
              <interface type='bridge'>
                <source bridge='br0'/>
                <model type='virtio'/>
                <link state='up'/>
              </interface>
              <controller type='virtio-serial' index='0'/>
              <channel type='unix'>
                <source mode='bind'/>
                <target type='virtio' name='org.qemu.guest_agent.0'/>
                <address type="virtio-serial" controller="0" bus="0" port="1"/>
              </channel>
              <serial type='pty'>
                <target type='isa-serial' port='0'>
                  <model name='isa-serial'/>
                </target>
              </serial>
              <console type='pty'>
                <target type='serial' port='0'/>
              </console>
              <input type='mouse' bus='ps2'/>
              <input type='keyboard' bus='ps2'/>
              <graphics type='vnc' port='-1' autoport='yes' listen='127.0.0.1'/>
            </devices>
          </domain>
      loop: "{{ vms }}"
      when: is_fresh_install_map[item.vm_name]

    - name: Configure VM autostart
      community.libvirt.virt:
        name: "{{ item.vm_name }}"
        autostart: "{{ vm_autostart }}"
      loop: "{{ vms }}"

    - name: Ensure VMs are started
      community.libvirt.virt:
        name: "{{ item.vm_name }}"
        state: running
      loop: "{{ vms }}"

    - name: Ensure guest agent is responding
      ansible.builtin.command: "virsh -c qemu:///system guestinfo {{ item.vm_name }}"
      register: agent_ready
      until: agent_ready.rc == 0
      retries: 25
      delay: 3
      changed_when: false
      loop: "{{ vms }}"
      when: is_fresh_install_map[item.vm_name]

    - name: Add new VMs to dynamic inventory
      ansible.builtin.add_host:
        name: "{{ item.vm_name }}"
        groups:
          - spawned_vms
          - "{{ 'mk8s_managers' if loop_idx == 0 else 'mk8s_workers' }}"
        vm_name: "{{ item.vm_name }}"
        static_ip: "{{ item.static_ip }}"
        ansible_connection: community.libvirt.libvirt_qemu
        ansible_libvirt_uri: "qemu:///system"
        ansible_libvirt_vm: "{{ item.vm_name }}"
        ansible_user: "root"
        admin_user: "{{ admin_user }}"
        ssh_pub_key_file: "{{ ssh_pub_key_file }}"
        is_fresh_install: "{{ is_fresh_install_map[item.vm_name] }}"
        dns_servers: "{{ dns_servers }}"
        gateway_ip: "{{ gateway_ip }}"
      loop: "{{ vms }}"
      loop_control:
        loop_var: item
        index_var: loop_idx

- name: Provision and configure OS on spawned VMs sequentially
  hosts: spawned_vms
  serial: 1
  gather_facts: true
  tasks:
    - name: Wait for system to become reachable
      ansible.builtin.wait_for_connection:
        delay: 5
        sleep: 5
        timeout: 60

    - name: Skip host — already provisioned
      when: not is_fresh_install
      block:
        - name: Display already provisioned message
          ansible.builtin.debug:
            msg: "{{ vm_name }} is already provisioned. Skipping Day 1 setup."
        - name: End host
          ansible.builtin.meta: end_host

    - name: Configure OS, hostname, user, and network (Day 1 initial setup)
      when: is_fresh_install
      block:
        - name: Expand root partition and filesystem
          ansible.builtin.shell: |
            ROOT_PART=$(findmnt -n -o SOURCE /)
            ROOT_DEV=$(echo "$ROOT_PART" | sed 's/p\?[0-9]*$//')
            ROOT_PART_NUM=$(echo "$ROOT_PART" | grep -o '[0-9]*$')
            growpart "$ROOT_DEV" "$ROOT_PART_NUM"
            FS_TYPE=$(findmnt -n -o FSTYPE /)
            if [ "$FS_TYPE" = "xfs" ]; then
              xfs_growfs /
            else
              resize2fs "$ROOT_PART"
            fi
          args:
            executable: /bin/bash
          register: growpart_result
          changed_when: "'CHANGED' in growpart_result.stdout"
          failed_when: "growpart_result.rc != 0 and 'NOCHANGE' not in growpart_result.stdout"

        - name: Set hostname to '{{ vm_name }}'
          ansible.builtin.hostname:
            name: "{{ vm_name }}"

        - name: Add all cluster VM hostnames and IPs to /etc/hosts
          ansible.builtin.lineinfile:
            path: /etc/hosts
            regexp: "^{{ hostvars[item]['static_ip'].split('/')[0] | regex_escape }}\\s+"
            line: "{{ hostvars[item]['static_ip'].split('/')[0] }} {{ hostvars[item]['vm_name'] }}"
            state: present
          loop: "{{ groups['spawned_vms'] }}"

        # - name: Configure GRUB kernel cmdline for serial console
        #   ansible.builtin.lineinfile:
        #     path: /etc/default/grub
        #     regexp: '^GRUB_CMDLINE_LINUX='
        #     line: 'GRUB_CMDLINE_LINUX="console=tty1 console=ttyS0,115200n8"'
        #     backrefs: no
        #   register: grub_serial_console
        #   become: yes

        # - name: Rebuild grub config on Debian family
        #   ansible.builtin.command: update-grub
        #   when:
        #     - ansible_os_family == 'Debian'
        #     - grub_serial_console.changed
        #   become: yes

        # - name: Rebuild grub config on RedHat family
        #   ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
        #   when:
        #     - ansible_os_family == 'RedHat'
        #     - grub_serial_console.changed
        #   become: yes

        # - name: Enable serial getty on ttyS0
        #   ansible.builtin.systemd:
        #     name: serial-getty@ttyS0.service
        #     enabled: true
        #     state: started
        #   become: yes

        - name: Ensure the user admin exists
          ansible.builtin.user:
            name: "{{ admin_user }}"
            group: users
            groups: "{{ (ansible_os_family == 'Debian') | ternary('sudo', 'wheel') }}"
            append: yes
            state: present
            create_home: yes
            shell: /bin/bash
            update_password: on_create
            password: "{{ lookup('ansible.builtin.password', '/dev/null length=32') | password_hash('sha512') }}"

        - name: Create ssh directory
          ansible.builtin.file:
            path: /home/{{ admin_user }}/.ssh
            state: directory
            owner: "{{ admin_user }}"
            group: users
            mode: "0700"

        - name: Add SSH public key for admin user
          ansible.posix.authorized_key:
            user: "{{ admin_user }}"
            state: present
            key: "{{ lookup('file', ssh_pub_key_file) }}"

        # - name: Remove default cloud users if they exist
        #   ansible.builtin.user:
        #     name: "{{ item }}"
        #     state: absent
        #     remove: yes
        #   loop:
        #     - ubuntu
        #     - debian
        #   when: item != admin_user

        - name: Configure passwordless sudo for admin user
          ansible.builtin.copy:
            dest: "/etc/sudoers.d/{{ admin_user }}"
            content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL"
            mode: "0440"
            validate: /usr/sbin/visudo -cf %s

- name: Configure static IP using systemd-networkd
  hosts: spawned_vms
  serial: 1
  gather_facts: false
  tasks:
    - name: End play if VM was already provisioned
      ansible.builtin.meta: end_host
      when: not is_fresh_install

    - name: Purge existing systemd-networkd configuration directory
      ansible.builtin.file:
        path: /etc/systemd/network
        state: absent

    - name: Ensure clean systemd-networkd directory exists
      ansible.builtin.file:
        path: /etc/systemd/network
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure static IP on physical interface in systemd-networkd
      ansible.builtin.copy:
        dest: /etc/systemd/network/10-static.network
        content: |
          [Match]
          Name=e*

          [Network]
          Address={{ static_ip }}
          {% for dns in dns_servers %}
          DNS={{ dns }}
          {% endfor %}

          IPv6AcceptRA=no

          [Route]
          Destination=0.0.0.0/0
          Gateway={{ gateway_ip }}
          GatewayOnLink=yes
          Metric=10
        owner: root
        group: root
        mode: "0644"

    - name: Restart systemd-networkd to apply static IP configuration
      ansible.builtin.systemd:
        name: systemd-networkd
        enabled: true
        state: restarted

    - name: Display VM Hostname and IP address summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - " VM Provisioning Summary"
          - " Hostname: {{ vm_name }}"
          - " Configured IP: {{ static_ip }}"
          - "=========================================="

- name: Update and install baseline tools on the spawned VMs
  hosts: spawned_vms
  serial: 1
  gather_facts: false
  tasks:
    - name: Skip host — already provisioned
      when: not is_fresh_install
      block:
        - name: Display already provisioned message
          ansible.builtin.debug:
            msg: "{{ vm_name }} is already provisioned. Skipping Day 1 setup."
        - name: End host
          ansible.builtin.meta: end_host

    - name: Upgrade all installed packages
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true

    # - name: Upgrade all installed packages OS-agnostic way
    #   ansible.builtin.apt:
    #     name: "*"
    #     state: latest
    # become: yes (Not needed: Agent connection is already root-privileged)

    - name: Ensure baseline tools are installed
      ansible.builtin.apt:
        name:
          - mc
          - htop
          - curl
          - wget
          - gnupg
          - apt-transport-https
          - jq
          - gpg
          - snapd
        state: present

    - name: Ensure snapd service is enabled and running
      ansible.builtin.systemd:
        name: snapd.service
        enabled: true
        state: started

    - name: Install microk8s via snap
      community.general.snap:
        name: microk8s
        channel: 1.36/stable
        classic: true
        state: present
      register: snap_install_result
      until: snap_install_result is succeeded
      retries: 3
      delay: 2

    # - name: Install microceph via snap
    #   community.general.snap:
    #     name: microceph
    #     channel: latest/edge
    #     classic: true
    #     state: present
    #   register: snap_install_result
    #   until: snap_install_result is succeeded
    #   retries: 3
    #   delay: 1

    # - name: Create microceph symlink
    #   ansible.builtin.file:
    #     src: /snap/bin/microceph
    #     dest: /usr/sbin/microceph
    #     state: link
    #     force: true

    # - name: Create ceph symlink
    #   ansible.builtin.file:
    #     src: /snap/bin/ceph
    #     dest: /usr/sbin/ceph
    #     state: link
    #     force: true

    - name: Add admin user to microk8s group
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: microk8s
        append: true
      when: admin_user is defined

    - name: Create microk8s symlink
      ansible.builtin.file:
        src: /snap/bin/microk8s
        dest: /usr/sbin/microk8s
        state: link
        force: true

    - name: Create required directories
      ansible.builtin.file:
        path: "/home/{{ admin_user }}/.kube"
        state: directory
        mode: "0700"
        owner: "{{ admin_user }}"
        group: users

    - name: Load required kernel modules and persist across reboots
      community.general.modprobe:
        name: "{{ item }}"
        state: present
        persistent: present
      loop:
        - br_netfilter
        - overlay
        - rbd

    - name: Configure sysctl settings
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/10-kubernetes.conf
        reload: true
      loop: "{{ sysctl_settings | dict2items }}"
      vars:
        sysctl_settings:
          net.bridge.bridge-nf-call-ip6tables: 1
          net.bridge.bridge-nf-call-iptables: 1
          net.ipv4.ip_forward: 1
          net.core.rmem_max: 262144
          net.core.wmem_max: 262144
          net.ipv4.tcp_rmem: "4096 87380 33554432"
          net.ipv4.tcp_wmem: "4096 65536 33554432"
          net.ipv4.ip_unprivileged_port_start: 80
          vm.swappiness: 10
          kernel.keys.maxbytes: 2000000
          kernel.keys.maxkeys: 2000
          vm.max_map_count: 262144

    - name: Configure KVM for nested virtualization
      ansible.builtin.copy:
        dest: /etc/modprobe.d/kvm.conf
        content: "options kvm_intel nested=1\n"
        mode: "0644"

    # - name: Reboot VM to apply changes
    #   ansible.builtin.reboot:
    #     reboot_timeout: 60

    - name: Reboot VM to apply changes
      ansible.builtin.command: systemctl reboot
      async: 1
      poll: 0
      changed_when: true

    - name: Wait for VM to become reachable after reboot
      ansible.builtin.wait_for_connection:
        delay: 10
        sleep: 5
        timeout: 60

- name: Initialize MicroK8s on manager
  hosts: mk8s_managers
  gather_facts: false
  tasks:
    - name: Skip host — already provisioned
      when: not is_fresh_install
      block:
        - name: Display already provisioned message
          ansible.builtin.debug:
            msg: "{{ vm_name }} is already provisioned. Skipping Day 1 setup."
        - name: End host
          ansible.builtin.meta: end_host

    - name: Wait for MicroK8s to be ready on manager
      ansible.builtin.command: microk8s status --wait-ready
      changed_when: false

    - name: Extract node IP address
      ansible.builtin.set_fact:
        node_ip: "{{ static_ip.split('/')[0] }}"

    - name: Create MicroK8s worker token
      ansible.builtin.shell: |
        microk8s add-node --token $(openssl rand -hex 16) --format short --token-ttl 1200 | grep "{{ node_ip }}"
      args:
        executable: /bin/bash
      register: microk8s_token
      changed_when: false

    - name: Set worker_token fact on manager
      ansible.builtin.set_fact:
        worker_token: "{{ microk8s_token.stdout | trim }}"

    - name: Save Microk8s token
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/jointoken.yml"
        content: |
          # Microk8s Tokens
          manager_ip: "{{ node_ip }}"
          worker_token: "{{ worker_token }}"
        mode: "0600"
      delegate_to: localhost
      become: false

- name: Join Worker nodes to MicroK8s cluster
  hosts: mk8s_workers
  serial: 1
  gather_facts: false
  tasks:
    - name: Skip host — already provisioned
      when: not is_fresh_install
      block:
        - name: Display already provisioned message
          ansible.builtin.debug:
            msg: "{{ vm_name }} is already provisioned. Skipping Day 1 setup."
        - name: End host
          ansible.builtin.meta: end_host

    - name: Wait for MicroK8s to be ready on worker
      ansible.builtin.command: microk8s status --wait-ready
      changed_when: false

    - name: Join MicroK8s cluster as worker
      ansible.builtin.command: "{{ hostvars[groups['mk8s_managers'][0]]['worker_token'] }} --worker"
      changed_when: true

- name: Verify MicroK8s cluster status
  hosts: mk8s_managers
  gather_facts: false
  tasks:
    - name: Retrieve cluster node list
      ansible.builtin.command: microk8s kubectl get nodes
      register: microk8s_get_nodes
      changed_when: false

    - name: Display Microk8s nodes
      ansible.builtin.debug:
        var: microk8s_get_nodes.stdout_lines
