    # - name: Enable serial getty on ttyS0
    #   ansible.builtin.systemd:
    #     name: serial-getty@ttyS0.service
    #     enabled: true
    #     state: started
    #   become: yes

    - name: Ensure the user admin exists
      ansible.builtin.user:
        name: "{{ admin_user }}"
        group: users
        groups: "{{ (ansible_os_family == 'Debian') | ternary('sudo', 'wheel') }}"
        append: yes
        state: present
        create_home: yes
        shell: /bin/bash
        update_password: on_create
        password: "{{ lookup('ansible.builtin.password', '/dev/null length=32') | password_hash('sha512') }}"
      become: yes

    - name: Create ssh directory
      ansible.builtin.file:
        path: /home/{{ admin_user }}/.ssh
        state: directory
        owner: "{{ admin_user }}"
        group: users
        mode: "0700"
      become: yes

    - name: Add SSH public key for admin user
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        state: present
        key: "{{ lookup('file', ssh_pub_key_file) }}"
      become: yes

