    - name: Configure passwordless sudo for admin user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL"
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      become: yes

- name: Configure static IP using systemd-networkd
  hosts: spawned_vms
  gather_facts: false
  tasks:
    - name: End play if VM was already provisioned
      ansible.builtin.meta: end_host
      when: not is_fresh_install

    - name: Purge existing systemd-networkd configuration directory
      ansible.builtin.file:
        path: /etc/systemd/network
        state: absent
      become: yes

    - name: Ensure clean systemd-networkd directory exists
      ansible.builtin.file:
        path: /etc/systemd/network
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: yes

    - name: Configure static IP in systemd-networkd
      ansible.builtin.copy:
        dest: /etc/systemd/network/10-static-en.network
        content: |
          [Match]
          Name=e*

          [Network]
          Address={{ static_ip }}
          {% for dns in dns_servers %}
          DNS={{ dns }}
          {% endfor %}

          IPv6AcceptRA=no
          [Route]
          Destination=0.0.0.0/0
          Gateway={{ gateway_ip }}
          GatewayOnLink=yes
          Metric=10
        owner: root
        group: root
        mode: "0644"
      become: yes

    - name: Restart systemd-networkd to apply static IP configuration
      ansible.builtin.systemd:
        name: systemd-networkd
        state: restarted
      become: true

    - name: Display VM Hostname and IP address summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - " VM Provisioning Summary"
          - " Hostname: {{ ansible_facts['hostname'] }}"
          - " Configured IP: {{ static_ip }}"
          - " IPv4 Address: {{ ansible_facts['default_ipv4']['address'] | default('N/A') }}"
          - "=========================================="

- name: Install packages and reboot
  hosts: spawned_vms
  gather_facts: false
  tasks:
    - name: End play if VM was already provisioned
      ansible.builtin.meta: end_host
      when: not is_fresh_install

    - name: Upgrade all installed packages OS-agnostic way
      ansible.builtin.apt:
        name: "*"
        state: latest
      # become: yes (Not needed: Agent connection is already root-privileged)

    - name: Ensure baseline tools are installed
      ansible.builtin.apt:
        name:
          - mc
          - htop
          - curl
          - wget
          - gnupg
        state: present
      become: true

    - name: Reboot VM to apply network changes
      ansible.builtin.command: systemctl reboot
      async: 1
      poll: 0
      changed_when: true
      become: true

    - name: Wait for VM to become reachable after reboot
      ansible.builtin.wait_for_connection:
        delay: 10
        sleep: 5
        timeout: 30

- name: Provision Samba Active Directory Domain Controller (AD DC)
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  vars:
    samba_realm: "HOMELAB.LAB"
    samba_netbios_domain: "HOMELAB"
    samba_domain: "homelab.lab"
    samba_hostname: "{{ vm_name }}"
    samba_ip: "{{ (static_ip | default(ansible_default_ipv4.address | default(''))).split('/')[0] }}"
    samba_network: "{{ ansible_facts['default_ipv4']['network'] }}/{{ static_ip.split('/')[-1] }}"
    samba_interface: "{{ ansible_facts['default_ipv4']['interface'] }}"
    samba_dns_forwarder: "9.9.9.9"
    samba_admin_password: "{{ lookup('ansible.builtin.env', 'SAMBA_ADMIN_PASSWORD') | default('Password1000!!', true) }}"
    samba_timezone: "Europe/Warsaw"

  handlers:
    - name: Restart chrony
      ansible.builtin.systemd:
        name: chrony
        state: restarted

    - name: Restart samba-ad-dc
      ansible.builtin.systemd:
        name: samba-ad-dc
        state: restarted

  tasks:
    - name: Check if Samba domain is already provisioned
      ansible.builtin.stat:
        path: /var/lib/samba/private/sam.ldb
      register: samba_provisioned

    - name: Configure /etc/hosts for Samba AD DC
      ansible.builtin.copy:
        dest: /etc/hosts
        owner: root
        group: root
        mode: "0644"
        content: |
          127.0.0.1 localhost
          {{ samba_ip }} {{ samba_hostname }}.{{ samba_domain }} {{ samba_hostname }}

          # The following lines are desirable for IPv6 capable hosts
          ::1     ip6-localhost ip6-loopback
          fe00::0 ip6-localnet
          ff00::0 ip6-mcastprefix
          ff02::1 ip6-allnodes
          ff02::2 ip6-allrouters

    - name: Install required packages for Samba AD DC
      ansible.builtin.apt:
        name:
          - acl
          - attr
          - samba
          - samba-dsdb-modules
          - samba-vfs-modules
          - smbclient
          - winbind
          - libpam-winbind
          - libnss-winbind
          - libpam-krb5
          - krb5-config
          - krb5-user
          - dnsutils
          - chrony
          - net-tools
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Ensure standalone Samba services are stopped and masked
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
        daemon_reload: true
      loop:
        - smbd
        - nmbd
        - winbind
      when: not samba_provisioned.stat.exists

    - name: Check if default smb.conf exists
      ansible.builtin.stat:
        path: /etc/samba/smb.conf
      register: default_smb_conf
      when: not samba_provisioned.stat.exists

    - name: Backup existing default smb.conf before provisioning
      ansible.builtin.command: mv /etc/samba/smb.conf /etc/samba/smb.conf.old
      when:
        - not samba_provisioned.stat.exists
        - default_smb_conf.stat.exists

    - name: Provision Samba Active Directory domain
      ansible.builtin.command:
        cmd: >
          samba-tool domain provision
          --use-rfc2307
          --server-role=dc
          --host-ip="{{ samba_ip }}"
          --dns-backend=SAMBA_INTERNAL
          --realm="{{ samba_realm }}"
          --domain="{{ samba_netbios_domain }}"
          --adminpass="{{ samba_admin_password }}"
          --option="dns forwarder={{ samba_dns_forwarder }}"
          --option="interfaces={{ samba_interface }} lo"
          --option="bind interfaces only=yes"
          --option="template shell=/bin/bash"
          --option="template homedir=/home/%U"
          --option="winbind nss info=rfc2307"
          --option="winbind use default domain=yes"
          --option="allow dns updates=nonsecure and secure"
          --option="write raw=yes"
          --option="log level=1"
          --option="aio read size=1"
          --option="aio write size=1"
          --option="server min protocol=SMB3"
          --option="server signing=mandatory"
          --option="smb encrypt=mandatory"
        creates: /var/lib/samba/private/sam.ldb
      no_log: false
      when: not samba_provisioned.stat.exists

    - name: Backup original /etc/krb5.conf
      ansible.builtin.copy:
        src: /etc/krb5.conf
        dest: /etc/krb5.conf.orig
        remote_src: true
        force: false
      when: not samba_provisioned.stat.exists

    - name: Copy Samba-generated krb5.conf to /etc/krb5.conf
      ansible.builtin.copy:
        src: /var/lib/samba/private/krb5.conf
        dest: /etc/krb5.conf
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: not samba_provisioned.stat.exists

    - name: Disable and stop systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove immutable flag from /etc/resolv.conf if present
      ansible.builtin.command: chattr -i /etc/resolv.conf
      failed_when: false
      changed_when: false

    - name: Remove symlink /etc/resolv.conf if present
      ansible.builtin.file:
        path: /etc/resolv.conf
        state: absent
      when: not samba_provisioned.stat.exists

    - name: Configure /etc/resolv.conf pointing to local Samba AD DNS
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Samba server IP address
          nameserver {{ samba_ip }}

          # Main domain for Samba
          search {{ samba_domain }}

    - name: Set immutable flag on /etc/resolv.conf
      ansible.builtin.command: chattr +i /etc/resolv.conf
      failed_when: false
      changed_when: false

    - name: Unmask, enable, and start samba-ad-dc service
      ansible.builtin.systemd:
        name: samba-ad-dc
        masked: false
        enabled: true
        state: started
        daemon_reload: true

    - name: Ensure sample share directory exists
      ansible.builtin.file:
        path: /srv/samba/data
        state: directory
        owner: root
        group: users
        mode: "0775"

    - name: Append sample [data] share to /etc/samba/smb.conf
      ansible.builtin.blockinfile:
        path: /etc/samba/smb.conf
        marker: "# {mark} ANSIBLE MANAGED BLOCK - DATA SHARE"
        block: |
          [data]
                  comment = Data Shared Folder
                  path = /srv/samba/data
                  read only = no
                  browseable = yes
                  guest ok = no
                  create mask = 0775
                  directory mask = 0775
      notify: Restart samba-ad-dc

    - name: Create directory for Samba NTP signed socket
      ansible.builtin.file:
        path: /var/lib/samba/ntp_signd
        state: directory
        owner: root
        group: _chrony
        mode: "0750"

    - name: Configure Chrony for Samba AD NTP signing
      ansible.builtin.blockinfile:
        path: /etc/chrony/chrony.conf
        marker: "# {mark} ANSIBLE MANAGED BLOCK - SAMBA AD CHRONY"
        block: |
          # bind the chrony service to IP address of the Samba AD
          bindcmdaddress {{ samba_ip }}
          allow {{ samba_network }}

          # specify the ntpsigndsocket directory for the Samba AD
          ntpsigndsocket /var/lib/samba/ntp_signd
      notify: Restart chrony

    - name: Set timezone to {{ samba_timezone }}
      ansible.builtin.command: timedatectl set-timezone {{ samba_timezone }}
      changed_when: false
      failed_when: false

    - name: Enable system NTP synchronization
      ansible.builtin.command: timedatectl set-ntp true
      changed_when: false
      failed_when: false

    - name: Ensure chrony service is enabled and started
      ansible.builtin.systemd:
        name: chrony
        enabled: true
        state: started

    - name: Ensure winbind is present in /etc/nsswitch.conf
      ansible.builtin.replace:
        path: /etc/nsswitch.conf
        regexp: '^({{ item }}:(?!.*\bwinbind\b).*)$'
        replace: '\1 winbind'
      loop:
        - passwd
        - group
        - shadow

    - name: Verify Samba domain level
      ansible.builtin.command: samba-tool domain level show
      register: domain_level
      changed_when: false

    - name: Display Samba AD DC status
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - " Samba AD DC provisioning completed successfully!"
          - " Realm: {{ samba_realm }}"
          - " Domain: {{ samba_netbios_domain }}"
          - " Server FQDN: {{ samba_hostname }}.{{ samba_domain }}"
          - " IP: {{ samba_ip }}"
          - " {{ domain_level.stdout_lines | default([]) }}"
          - "=========================================="
