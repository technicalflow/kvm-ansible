- name: Update and install baseline tools and Incus on spawned VMs
  hosts: spawned_vms
  serial: 1
  gather_facts: true
  tasks:
    - name: Upgrade all installed packages OS-agnostic way
      ansible.builtin.package:
        name: "*"
        state: latest
      # become: yes (Not needed: Agent connection is already root-privileged)

    - name: Ensure baseline tools are installed
      ansible.builtin.package:
        name:
          - mc
          - htop
          - curl
          - wget
          - gnupg
        state: present

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Incus official GPG key
      ansible.builtin.get_url:
        url: https://pkgs.zabbly.com/key.asc
        dest: /etc/apt/keyrings/zabbly.asc
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Configure Incus official APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/zabbly.asc] https://pkgs.zabbly.com/incus/lts-7.0 {{ ansible_distribution_release }} main"
        filename: zabbly
        state: present

    - name: Upgrade all installed packages OS-agnostic way
      ansible.builtin.package:
        name: "*"
        state: latest
      # become: yes (Not needed: Agent connection is already root-privileged)

    - name: Install Incus and cluster prerequisites
      ansible.builtin.package:
        name:
          - incus
          - incus-client
          - lxcfs
          - criu
          - uidmap
        state: present

    - name: Ensure Incus service is enabled and running
      ansible.builtin.systemd:
        name: incus
        enabled: true
        state: started

    - name: Add admin user to Incus groups
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: "incus,incus-admin"
        append: yes
      when: admin_user is defined

    - name: Reboot VM to apply changes
      ansible.builtin.command: systemctl reboot
      async: 1
      poll: 0
      changed_when: true

    - name: Wait for VM to become reachable after reboot
      ansible.builtin.wait_for_connection:
        delay: 15
        sleep: 5
        timeout: 60

- name: Initialize the Incus bootstrap member
  hosts: incus_bootstrap
  gather_facts: false
  tasks:
    - name: Extract node IP address
      ansible.builtin.set_fact:
        node_ip: "{{ static_ip.split('/')[0] }}"

    - name: Check whether this member is already clustered
      ansible.builtin.command: incus config get cluster.https_address
      register: incus_cluster_status
      changed_when: false
      failed_when: false

    - name: Initialize the Incus cluster
      ansible.builtin.command: incus admin init --preseed
      args:
        stdin: |
          config:
            core.https_address: {{ node_ip }}:8443
          storage_pools:
            - name: default
              driver: dir
          networks:
            - name: incusbr0
              type: bridge
              config:
                ipv4.address: "172.20.20.1/24"
                ipv4.nat: "true"
                ipv6.address: "fd40:cafe::1/64"
                ipv6.nat: "true"
          profiles:
            - config: {}
              name: default
              description: Default profile
              devices:
                eth0:
                  name: eth0
                  network: incusbr0
                  type: nic
                root:
                  path: /
                  pool: default
                  type: disk
            - config:
                limits.cpu: "2"
                limits.memory: 4GB
                limits.memory.enforce: soft
                limits.memory.swap: "false"
              description: Macvlan profile
              devices:
                eth0:
                  name: eth0
                  nictype: macvlan
                  parent: eth0
                  type: nic
                root:
                  path: /
                  pool: default
                  type: disk
              name: macvlan
              project: ""
          cluster:
            server_name: {{ vm_name }}
            enabled: true
      when: incus_cluster_status.stdout | trim == ''

    - name: Check which joining members still need a cluster token
      ansible.builtin.command: incus cluster list --format csv
      register: incus_members
      changed_when: false

    - name: Generate a join token for each missing member
      ansible.builtin.command: "incus cluster add --quiet {{ hostvars[item].vm_name }}"
      loop: "{{ groups['incus_joiners'] }}"
      register: incus_token_commands
      when: "hostvars[item].vm_name not in incus_members.stdout"
      changed_when: true
      no_log: true

    - name: Store join tokens by member name
      ansible.builtin.set_fact:
        incus_join_tokens: "{{ incus_join_tokens | default({}) | combine({item.item: (item.stdout_lines | default([]))[-1] | default(item.stdout) | trim}) }}"
      loop: "{{ incus_token_commands.results }}"
      when:
        - not item.skipped | default(false)
        - item.rc | default(1) == 0

- name: Join the remaining members to the Incus cluster
  hosts: incus_joiners
  serial: 1
  gather_facts: false
  tasks:
    - name: Check whether this member is already in the cluster
      ansible.builtin.command: incus cluster list --format csv
      register: incus_cluster_members
      changed_when: false
      failed_when: false

    - name: Extract bootstrap member details
      ansible.builtin.set_fact:
        bootstrap_host: "{{ groups['incus_bootstrap'][0] }}"

    - name: Extract node IP address
      ansible.builtin.set_fact:
        node_ip: "{{ static_ip.split('/')[0] }}"

    - name: Join the Incus cluster
      ansible.builtin.command: incus admin init --preseed
      args:
        stdin: |
          cluster:
            server_name: {{ vm_name }}
            enabled: true
            server_address: {{ node_ip }}:8443
            cluster_token: "{{ hostvars[bootstrap_host].incus_join_tokens[inventory_hostname] }}"
            member_config:
              - entity: storage-pool
                name: default
                key: source
                value: ""
      when: inventory_hostname not in incus_cluster_members.stdout
      no_log: false

- name: Verify Incus cluster status
  hosts: incus_bootstrap
  gather_facts: false
  tasks:
    - name: Retrieve cluster node list
      ansible.builtin.command: incus cluster list
      register: incus_cluster_list
      changed_when: false

    - name: Display Incus cluster members
      ansible.builtin.debug:
        var: incus_cluster_list.stdout_lines
# Required collections on Ansible control node:
# ansible-galaxy collection install community.libvirt ansible.posix
