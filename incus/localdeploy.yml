    #   loop:
    #     - /etc/netplan/50-cloud-init.yaml
    #     - /etc/netplan/00-installer-config.yaml
    #   failed_when: false
    #   become: yes

    - name: Configure static IP on physical interface in systemd-networkd
      ansible.builtin.copy:
        dest: /etc/systemd/network/10-static-eth0.network
        content: |
          [Match]
          Name=e*

          [Network]
          Address={{ static_ip }}
          {% for dns in dns_servers %}
          DNS={{ dns }}
          {% endfor %}

          IPv6AcceptRA=no

          [Route]
          Destination=0.0.0.0/0
          Gateway={{ gateway_ip }}
          GatewayOnLink=yes
          Metric=10
        owner: root
        group: root
        mode: "0644"

    - name: Ensure Incus virtual bridge and veth devices are unmanaged by systemd-networkd
      ansible.builtin.copy:
        dest: /etc/systemd/network/99-incus-unmanaged.network
        content: |
          [Match]
          Name=incus* veth*

          [Link]
          Unmanaged=yes
        owner: root
        group: root
        mode: "0644"

    - name: Reload udev rules
      ansible.builtin.command: udevadm control --reload-rules
      changed_when: false

    - name: Trigger udev rules
      ansible.builtin.command: udevadm trigger
      changed_when: false

    - name: Restart systemd-networkd to apply static IP configuration
      ansible.builtin.systemd:
        name: systemd-networkd
        enabled: true
        state: restarted

