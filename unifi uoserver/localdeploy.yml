- name: Install and configure UniFi OS Server
  hosts: spawned_vms
  become: true
  gather_facts: false
  vars:
    uos_version: "5.1.42"
    uos_installer: "/opt/unifi-os-server.bin"
    uos_installer_url: "https://fw-download.ubnt.com/data/unifi-os-server/5172-linux-x64-5.1.42-12e9e3cf-8f8b-4e54-928c-76b80a10c8a4.42-x64"
    uos_webui_port: "8443"

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - podman
          - uidmap
          - ufw
        state: present
        update_cache: true

    - name: Download UniFi OS Server installer
      ansible.builtin.get_url:
        url: "{{ uos_installer_url }}"
        dest: "{{ uos_installer }}"
        mode: "0755"

    - name: Run UniFi OS Server installer
      ansible.builtin.command: "{{ uos_installer }} --non-interactive --web-port {{ uos_webui_port }}"
      args:
        creates: "/opt/uosserver/.installed_{{ uos_version }}"

    - name: Ensure UniFi OS services are running and enabled
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - uosserver
        - uosserver-updater

    - name: Start uosserver
      ansible.builtin.systemd:
        name: uosserver
        enabled: true
        state: started

    - name: Start uosserver-updater
      ansible.builtin.systemd:
        name: uosserver-updater
        enabled: true
        state: started

    # - name: Ensure admin user exists
    #   ansible.builtin.user:
    #     name: "{{ admin_user }}"
    #     state: present
    #     create_home: true

    - name: Add admin user to uosserver group
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: uosserver
        append: true

    - name: Set UFW default incoming policy to deny
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Allow SSH in UFW
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Allow UniFi service ports in UFW
      community.general.ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: "{{ item.comment }}"
      loop:
        - { port: "11443", proto: "tcp", comment: "UniFi OS Server Web UI (HTTPS)" }
        - { port: "8080", proto: "tcp", comment: "UniFi device inform" }
        - { port: "{{ uos_webui_port }}", proto: "tcp", comment: "UniFi legacy controller" }
        - { port: "8880", proto: "tcp", comment: "UniFi guest portal HTTP" }
        - { port: "8843", proto: "tcp", comment: "UniFi guest portal HTTPS" }
        - { port: "3478", proto: "udp", comment: "UniFi STUN" }
        - { port: "10001", proto: "udp", comment: "UniFi device discovery" }
        - { port: "1900", proto: "udp", comment: "UPnP/UniFi discovery" }

    - name: Enable UFW firewall
      community.general.ufw:
        state: enabled

