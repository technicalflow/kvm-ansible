---
- name: Deploy KVM VMs for Kubernetes using local Debian image
  hosts: localhost
  serial: 1
  become: true
  vars:
    # Accumulator for the dynamic VM list built in pre_tasks below. Must
    # start as an empty list: the set_fact loop references `vms` on the
    # right-hand side of its own assignment on every iteration.
    vms: []

    # Number of master and worker VMs to provision.
    # NOTE: num_masters > 1 enables a kube-vip powered HA control plane
    # (see control_plane_vip below). The static-IP math a few lines down
    # does simple last-octet addition with no carry, so keep
    # num_masters + num_workers well under 250 on a /24-sized allocation.
    num_masters: 3
    num_workers: 3

    # VM naming — nodes are named <vm_name_prefix><zero-padded index>
    vm_name_prefix: "msksidb13k8sa"
    extra_disk: true

    # Dedicated NAT network for all Kubernetes nodes
    nat_network_name: "nat-{{ vm_name_prefix[-4:] }}"
    nat_bridge_name: "virbr-{{ vm_name_prefix[-4:] }}"
    nat_net: "192.168.67" # First three octets; a /24 is assumed
    nat_prefix: 24
    nat_gateway_ip: "{{ nat_net }}.1"
    nat_mac_prefix: "52:54:00:63:30"

    # Workers only ever get a NAT-network NIC, while masters also have a
    # br0 NIC — Calico's node-IP autodetection must be pinned to the NAT
    # subnet so it doesn't pick br0 on masters instead.
    calico_node_address_cidr: "{{ nat_net }}.0/{{ nat_prefix }}"

    # Host bridge (br0) network settings for second adapter on master nodes
    # First master's IP (br0_ip_base); further masters increment from it
    br0_bridge_name: "br0"
    br0_ip_base: "192.168.50.238"
    br0_ip_subnet: "/23"
    br0_gateway_ip: "192.168.50.250"
    br0_mac_prefix: "52:54:00:50:30"
    dns_servers:
      - "9.9.9.9"
      - "192.168.50.242"

    # Master VM resources (from Vagrantfile: 4 CPUs, 4096 MB)
    master_disk_size: "32G"
    master_extra_disk_size: "30G"
    master_vm_vcpus: 4
    master_vm_memory_kb: 4194304 # 4096 MB

    # Worker VM resources (from Vagrantfile: 4 CPUs, 2048 MB)
    worker_disk_size: "32G"
    worker_extra_disk_size: "30G"
    worker_vm_vcpus: 4
    worker_vm_memory_kb: 2097152 # 2048 MB

    # Kubernetes settings
    k8s_version: "v1.37"
    pod_network_cidr: "172.21.0.0/16"
    calico_version: "v3.32.1"
    remove_master_taint: true
    timezone: "Europe/Warsaw"

    # HA control-plane endpoint, fronted by kube-vip (ARP mode) whenever num_masters > 1.
    # Must be a free address on the NAT network
    control_plane_vip: "{{ nat_net }}.200"
    control_plane_vip_port: 6443
    # Re-check https://github.com/kube-vip/kube-vip/releases before bumping.
    kube_vip_version: "v1.2.4"

    admin_user: "madmin"
    ssh_pub_key_file: "/home/madmin/.ssh/ansible.pub"
    vm_autostart: false

    target_disk_dir: "/nvme/vms"
    target_extra_disk_dir: "/data/VMS"
    template_image_path: "/data/ISO/VMIMAGES/KVM/debian13withuefi.qcow2"
    uefi_code_path: "{{ '/usr/share/OVMF/OVMF_CODE_4M.fd' if ansible_os_family == 'Debian' else '/usr/share/edk2/ovmf/OVMF_CODE.fd' }}"
    uefi_vars_template_path: "{{ '/usr/share/OVMF/OVMF_VARS_4M.fd' if ansible_os_family == 'Debian' else '/usr/share/edk2/ovmf/OVMF_VARS.fd' }}"
    emulator_path: "{{ '/usr/bin/qemu-system-x86_64' if ansible_os_family == 'Debian' else '/usr/libexec/qemu-kvm' }}"

  pre_tasks:
    - name: Build dynamic VM list from num_masters and num_workers
      ansible.builtin.set_fact:
        vms: >-
          {{
            vms + [{
              'vm_name': vm_name_prefix ~ ('%02d' | format(idx + 1)),
              'is_master': (idx < num_masters),
              'static_ip': nat_net ~ '.' ~ (idx + 2) ~ '/' ~ nat_prefix,
              'br0_ip': ((br0_ip_base.split('.')[:3] | join('.')) ~ '.' ~
                         (((br0_ip_base.split('.')[3] | int) + idx) | string) ~ br0_ip_subnet)
                        if idx < num_masters else '',
              'nat_mac': nat_mac_prefix ~ ':' ~ ('%02x' | format(idx + 2)),
              'br0_mac': br0_mac_prefix ~ ':' ~ ('%02x' | format(idx + 2)),
              'disk_size':    master_disk_size    if idx < num_masters else worker_disk_size,
              'extra_disk_size': master_extra_disk_size if idx < num_masters else worker_extra_disk_size,
              'vm_vcpus':     master_vm_vcpus     if idx < num_masters else worker_vm_vcpus,
              'vm_memory_kb': master_vm_memory_kb if idx < num_masters else worker_vm_memory_kb
            }]
          }}
      loop: "{{ range(0, num_masters + num_workers) | list }}"
      loop_control:
        loop_var: idx

  tasks:
    - name: Ensure required packages are installed (RedHat/CentOS/Fedora)
      ansible.builtin.package:
        name:
          - python3-libvirt
          - qemu-img
          - libvirt-client
          - edk2-ovmf
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Ensure UEFI firmware is installed (Debian/Ubuntu)
      ansible.builtin.package:
        name:
          - python3-libvirt
          - qemu-utils
          - libvirt-clients
          - ovmf
        state: present
      when: ansible_os_family == 'Debian'

    - name: Define libvirt NAT network for Kubernetes ({{ nat_network_name }})
      community.libvirt.virt_net:
        command: define
        name: "{{ nat_network_name }}"
        xml: |
          <network>
            <name>{{ nat_network_name }}</name>
            <forward mode='nat'>
              <nat>
                <port start='1024' end='65535'/>
              </nat>
            </forward>
            <bridge name='{{ nat_bridge_name }}' stp='on' delay='0'/>
            <ip address='{{ nat_gateway_ip }}' prefix='{{ nat_prefix }}'>
            </ip>
          </network>

    - name: Ensure libvirt NAT network is active
      community.libvirt.virt_net:
        name: "{{ nat_network_name }}"
        state: active

    - name: Configure libvirt NAT network autostart
      community.libvirt.virt_net:
        name: "{{ nat_network_name }}"
        autostart: true

    - name: Ensure libvirt UEFI NVRAM directory exists
      ansible.builtin.file:
        path: /var/lib/libvirt/qemu/nvram
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure target disk directory exists
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ target_disk_dir }}"
        - "{{ target_extra_disk_dir }}"

    - name: Check if VM domains exist in libvirt
      ansible.builtin.command: "virsh -c qemu:///system dominfo {{ item.vm_name }}"
      register: virsh_dominfo
      loop: "{{ vms }}"
      failed_when: false
      changed_when: false

    - name: Record fresh install status per VM
      ansible.builtin.set_fact:
        is_fresh_install_map: "{{ is_fresh_install_map | default({}) | combine({item.item.vm_name: (item.rc != 0)}) }}"
      loop: "{{ virsh_dominfo.results }}"

    - name: End play early if all VMs are already provisioned
      when: "true not in is_fresh_install_map.values() | list"
      block:
        - name: Display already provisioned message
          ansible.builtin.debug:
            msg: "All VMs ({{ is_fresh_install_map.keys() | list | join(', ') }}) are already defined in libvirt. Nothing to provision."
        - name: End play
          ansible.builtin.meta: end_play

    - name: Check if destination images already exist
      ansible.builtin.stat:
        path: "{{ target_disk_dir }}/{{ item.vm_name }}.qcow2"
      loop: "{{ vms }}"
      register: destination_disks

    - name: Create standalone VM disks from local template
      ansible.builtin.copy:
        src: "{{ template_image_path }}"
        dest: "{{ target_disk_dir }}/{{ item.item.vm_name }}.qcow2"
        remote_src: true
        force: false
        owner: root
        group: root
        mode: "0644"
      loop: "{{ destination_disks.results }}"
      when: not item.stat.exists

    - name: Resize the images to desired disk size
      ansible.builtin.command: "qemu-img resize {{ target_disk_dir }}/{{ item.item.vm_name }}.qcow2 {{ item.item.disk_size }}"
      register: resize_output
      changed_when: true
      loop: "{{ destination_disks.results }}"
      when: not item.stat.exists

    - name: Check if destination extra disks already exist
      ansible.builtin.stat:
        path: "{{ target_extra_disk_dir }}/{{ item.vm_name }}_extra.qcow2"
      loop: "{{ vms }}"
      register: destination_extra_disks
      when: extra_disk

    - name: Create extra disk images for VMs
      ansible.builtin.command: "qemu-img create -f qcow2 {{ target_extra_disk_dir }}/{{ item.item.vm_name }}_extra.qcow2 {{ item.item.extra_disk_size }}"
      changed_when: not item.stat.exists
      loop: "{{ destination_extra_disks.results }}"
      when: extra_disk and not item.stat.exists

    - name: Define VM domains in libvirt
      community.libvirt.virt:
        command: define
        xml: |
          <domain type='kvm'>
            <name>{{ item.vm_name }}</name>
            <memory unit='KiB'>{{ item.vm_memory_kb }}</memory>
            <currentMemory unit='KiB'>{{ item.vm_memory_kb }}</currentMemory>
            <description>Kubernetes VM provisioned by Ansible</description>
            <vcpu placement='static'>{{ item.vm_vcpus }}</vcpu>
            <cpu mode='host-passthrough' check='none'>
              <topology sockets='1' dies='1' clusters='1' cores='{{ item.vm_vcpus }}' threads='1'/>
              <feature policy='require' name='vmx'/>
            </cpu>
            <os>
              <type arch='x86_64' machine='q35'>hvm</type>
              <loader readonly='yes' secure='no' type='pflash' format='raw'>{{ uefi_code_path }}</loader>
              <nvram template='{{ uefi_vars_template_path }}' templateFormat='raw' format='raw'>/var/lib/libvirt/qemu/nvram/{{ item.vm_name }}_VARS.fd</nvram>
              <boot dev='hd'/>
              <bootmenu enable='no'/>
            </os>
            <on_poweroff>destroy</on_poweroff>
            <on_reboot>restart</on_reboot>
            <on_crash>destroy</on_crash>
            <features>
              <acpi/>
              <apic/>
              <smm state='on'/>
              <ioapic driver='kvm'/>
            </features>
            <clock offset='utc'>
              <timer name='rtc' tickpolicy='catchup'/>
              <timer name='pit' tickpolicy='delay'/>
              <timer name='hpet' present='no'/>
            </clock>
            <pm>
              <suspend-to-mem enabled='no'/>
              <suspend-to-disk enabled='no'/>
            </pm>
            <devices>
              <emulator>{{ emulator_path }}</emulator>
              <disk type='file' device='disk'>
                <driver name='qemu' type='qcow2' cache='writeback'/>
                <source file='{{ target_disk_dir }}/{{ item.vm_name }}.qcow2'/>
                <target dev='vda' bus='virtio'/>
              </disk>
              {% if extra_disk %}
              <disk type='file' device='disk'>
                <driver name='qemu' type='qcow2' cache='writeback'/>
                <source file='{{ target_extra_disk_dir }}/{{ item.vm_name }}_extra.qcow2'/>
                <target dev='vdb' bus='virtio'/>
              </disk>
              {% endif %}
              {% if item.is_master %}
              <interface type='bridge'>
                <mac address='{{ item.br0_mac }}'/>
                <source bridge='{{ br0_bridge_name }}'/>
                <model type='virtio'/>
                <link state='up'/>
              </interface>
              {% endif %}
              <interface type='network'>
                <mac address='{{ item.nat_mac }}'/>
                <source network='{{ nat_network_name }}'/>
                <model type='virtio'/>
                <link state='up'/>
              </interface>
              <controller type='virtio-serial' index='0'/>
              <channel type='unix'>
                <source mode='bind'/>
                <target type='virtio' name='org.qemu.guest_agent.0'/>
                <address type='virtio-serial' controller='0' bus='0' port='1'/>
              </channel>
              <serial type='pty'>
                <target type='isa-serial' port='0'>
                  <model name='isa-serial'/>
                </target>
              </serial>
              <console type='pty'>
                <target type='serial' port='0'/>
              </console>
              <input type='mouse' bus='ps2'/>
              <input type='keyboard' bus='ps2'/>
              <graphics type='vnc' port='-1' autoport='yes' listen='127.0.0.1'/>
            </devices>
          </domain>
      loop: "{{ vms }}"
      when: is_fresh_install_map[item.vm_name]

    - name: Configure VM autostart
      community.libvirt.virt:
        name: "{{ item.vm_name }}"
        autostart: "{{ vm_autostart }}"
      loop: "{{ vms }}"

    - name: Ensure VMs are started
      community.libvirt.virt:
        name: "{{ item.vm_name }}"
        state: running
      loop: "{{ vms }}"
      loop_control:
        pause: 5

    - name: Ensure guest agent is responding
      ansible.builtin.command: "virsh -c qemu:///system guestinfo {{ item.vm_name }}"
      register: agent_ready
      until: agent_ready.rc == 0
      retries: 20
      delay: 3
      changed_when: false
      become: false
      loop: "{{ vms }}"

    - name: Add new VMs to dynamic inventory
      ansible.builtin.add_host:
        name: "{{ item.vm_name }}"
        groups:
          - spawned_vms
          - "{{ 'k8s_masters' if item.is_master else 'k8s_workers' }}"
        vm_name: "{{ item.vm_name }}"
        is_master: "{{ item.is_master }}"
        num_masters: "{{ num_masters }}"
        num_workers: "{{ num_workers }}"
        static_ip: "{{ item.static_ip }}"
        br0_ip: "{{ item.br0_ip }}"
        nat_mac: "{{ item.nat_mac }}"
        br0_mac: "{{ item.br0_mac }}"
        disk_size: "{{ item.disk_size }}"
        extra_disk_size: "{{ item.extra_disk_size }}"
        extra_disk: "{{ extra_disk }}"
        nat_gateway_ip: "{{ nat_gateway_ip }}"
        br0_gateway_ip: "{{ br0_gateway_ip }}"
        dns_servers: "{{ dns_servers }}"
        k8s_version: "{{ k8s_version }}"
        pod_network_cidr: "{{ pod_network_cidr }}"
        calico_version: "{{ calico_version }}"
        timezone: "{{ timezone }}"
        ansible_connection: community.libvirt.libvirt_qemu
        ansible_libvirt_uri: "qemu:///system"
        ansible_libvirt_vm: "{{ item.vm_name }}"
        # ansible_user: "root"
        admin_user: "{{ admin_user }}"
        ssh_pub_key_file: "{{ ssh_pub_key_file }}"
        calico_node_address_cidr: "{{ calico_node_address_cidr }}"
        control_plane_vip: "{{ control_plane_vip }}"
        control_plane_vip_port: "{{ control_plane_vip_port }}"
        kube_vip_version: "{{ kube_vip_version }}"
        remove_master_taint: "{{ remove_master_taint }}"
        is_fresh_install: "{{ is_fresh_install_map[item.vm_name] }}"
      loop: "{{ vms }}"
      loop_control:
        loop_var: item

- name: Configure OS, hostname, user, and network on spawned VMs sequentially
  hosts: spawned_vms
  serial: 1
  gather_facts: true
  tasks:
    - name: Wait for system to become reachable
      ansible.builtin.wait_for_connection:
        delay: 1
        sleep: 5
        timeout: 30

    - name: Skip host — already provisioned
      when: not is_fresh_install
      block:
        - name: Display already provisioned message
          ansible.builtin.debug:
            msg: "{{ vm_name }} is already provisioned. Skipping Day 1 setup."
        - name: End host
          ansible.builtin.meta: end_host

    - name: Configure OS, hostname, user, and network (Day 1 initial setup)
      when: is_fresh_install
      block:
        - name: Expand root partition and filesystem
          ansible.builtin.shell: |
            ROOT_PART=$(findmnt -n -o SOURCE /)
            ROOT_DEV=$(echo "$ROOT_PART" | sed 's/p\?[0-9]*$//')
            ROOT_PART_NUM=$(echo "$ROOT_PART" | grep -o '[0-9]*$')
            growpart "$ROOT_DEV" "$ROOT_PART_NUM"
            FS_TYPE=$(findmnt -n -o FSTYPE /)
            if [ "$FS_TYPE" = "xfs" ]; then
              xfs_growfs /
            else
              resize2fs "$ROOT_PART"
            fi
          args:
            executable: /bin/bash
          register: growpart_result
          changed_when: "'CHANGED' in growpart_result.stdout"
          failed_when: "growpart_result.rc != 0 and 'NOCHANGE' not in growpart_result.stdout"

        - name: Format extra disk (/dev/vdb) with ext4 for Longhorn
          community.general.filesystem:
            fstype: ext4
            dev: /dev/vdb
          when: extra_disk

        - name: Mount /dev/vdb to /var/lib/longhorn
          ansible.posix.mount:
            path: /var/lib/longhorn
            src: /dev/vdb
            fstype: ext4
            opts: defaults
            state: mounted
          when: extra_disk

        - name: Set timezone to {{ timezone }}
          ansible.builtin.command: "timedatectl set-timezone {{ timezone }}"
          changed_when: true

        - name: Set hostname to '{{ vm_name }}'
          ansible.builtin.hostname:
            name: "{{ vm_name }}"

        - name: Add all cluster VM hostnames and NAT IPs to /etc/hosts
          ansible.builtin.lineinfile:
            path: /etc/hosts
            regexp: "^{{ hostvars[item]['static_ip'].split('/')[0] | regex_escape }}\\s+"
            line: "{{ hostvars[item]['static_ip'].split('/')[0] }} {{ hostvars[item]['vm_name'] }}"
            state: present
          loop: "{{ groups['spawned_vms'] }}"

        - name: Ensure the admin user exists
          ansible.builtin.user:
            name: "{{ admin_user }}"
            group: users
            groups: "{{ (ansible_os_family == 'Debian') | ternary('sudo', 'wheel') }}"
            append: true
            state: present
            create_home: true
            shell: /bin/bash
            update_password: on_create
            password: "{{ lookup('ansible.builtin.password', '/dev/null length=32') | password_hash('sha512') }}"

        - name: Create ssh directory
          ansible.builtin.file:
            path: "/home/{{ admin_user }}/.ssh"
            state: directory
            owner: "{{ admin_user }}"
            group: users
            mode: "0700"

        - name: Add SSH public key for admin user
          ansible.posix.authorized_key:
            user: "{{ admin_user }}"
            state: present
            key: "{{ lookup('file', ssh_pub_key_file) }}"

        - name: Configure passwordless sudo for admin user
          ansible.builtin.copy:
            dest: "/etc/sudoers.d/{{ admin_user }}"
            content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL"
            mode: "0440"
            validate: /usr/sbin/visudo -cf %s

        - name: Purge existing systemd-networkd configuration directory
          ansible.builtin.file:
            path: /etc/systemd/network
            state: absent

        - name: Ensure clean systemd-networkd directory exists
          ansible.builtin.file:
            path: /etc/systemd/network
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Configure first adapter (br0) in systemd-networkd on master nodes
          ansible.builtin.copy:
            dest: /etc/systemd/network/20-br0.network
            content: |
              [Match]
              MACAddress={{ br0_mac }}

              [Network]
              Address={{ br0_ip }}
              {% for dns in dns_servers %}
              DNS={{ dns }}
              {% endfor %}
              IPv6AcceptRA=no

              [Route]
              Destination=0.0.0.0/0
              Gateway={{ br0_gateway_ip }}
              GatewayOnLink=yes
              Metric=10
            owner: root
            group: root
            mode: "0644"
          when: is_master

        - name: Configure static IP on NAT adapter in systemd-networkd
          ansible.builtin.copy:
            dest: /etc/systemd/network/10-k8s-nat.network
            content: |
              [Match]
              MACAddress={{ nat_mac }}

              [Network]
              Address={{ static_ip }}
              {% for dns in dns_servers %}
              DNS={{ dns }}
              {% endfor %}
              IPv6AcceptRA=no

              [Route]
              Destination=0.0.0.0/0
              Gateway={{ nat_gateway_ip }}
              GatewayOnLink=yes
              Metric={{ '100' if is_master else '10' }}
            owner: root
            group: root
            mode: "0644"

        - name: Restart systemd-networkd
          ansible.builtin.systemd:
            name: systemd-networkd
            enabled: true
            state: restarted

        - name: Display VM Hostname and IP address summary
          ansible.builtin.debug:
            msg:
              - "=========================================="
              - " VM Provisioning Summary"
              - " Hostname: {{ vm_name }}"
              - " Role: {{ 'Master' if is_master else 'Worker' }}"
              - " NAT IP: {{ static_ip }}"
              - "=========================================="

- name: Install and configure Kubernetes prerequisites on spawned VMs
  hosts: spawned_vms
  serial: 1
  gather_facts: false
  tasks:
    - name: Skip host — already provisioned
      when: not is_fresh_install
      block:
        - name: Display already provisioned message
          ansible.builtin.debug:
            msg: "{{ vm_name }} is already provisioned. Skipping Kubernetes node setup."
        - name: End host
          ansible.builtin.meta: end_host

    - name: Upgrade all installed packages
      ansible.builtin.apt:
        name: "*"
        state: latest
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Ensure baseline and Kubernetes prerequisite packages are installed
      ansible.builtin.apt:
        name:
          - htop
          - wget
          - curl
          - git
          - gnupg
          - ca-certificates
          - apt-transport-https
          - gpg
          - ethtool
          - jq
          - open-iscsi
          - nfs-common
          - cryptsetup
          - dmsetup
        state: present
        autoclean: true
        autoremove: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    # - name: Disable swap immediately
    #   ansible.builtin.command: swapoff -a
    #   changed_when: false

    # - name: Disable swap permanently in /etc/fstab
    #   ansible.builtin.replace:
    #     path: /etc/fstab
    #     regexp: '^([^#].*?\sswap\s+.*)$'
    #     replace: '# \1'

    - name: Persist required kernel modules for Kubernetes
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          iscsi_tcp
          br_netfilter
          overlay
        owner: root
        group: root
        mode: "0644"

    - name: Load br_netfilter and overlay kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - br_netfilter
        - overlay
        - iscsi_tcp

    - name: Configure sysctl parameters for Kubernetes
      ansible.builtin.copy:
        dest: /etc/sysctl.d/10-kubernetes.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
          net.core.rmem_max = 262144
          net.core.wmem_max = 262144
          net.ipv4.tcp_rmem = 4096 87380 33554432
          net.ipv4.tcp_wmem = 4096 65536 33554432
          net.ipv4.ip_unprivileged_port_start=80
          vm.swappiness=10
          fs.aio-max-nr=524288
          kernel.keys.maxbytes=2000000
          kernel.keys.maxkeys=2000
          vm.max_map_count=262144
        owner: root
        group: root
        mode: "0644"

    - name: Apply sysctl parameters
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download and dearmor Kubernetes APT repository GPG key
      ansible.builtin.shell: |
        curl -fsSL "https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/Release.key" \
          | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/ /
        owner: root
        group: root
        mode: "0644"

    - name: Download and dearmor Docker APT repository GPG key
      ansible.builtin.shell: |
        curl -fsSL "https://download.docker.com/linux/debian/gpg" \
          | gpg --dearmor --yes -o /etc/apt/keyrings/docker-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/docker-apt-keyring.gpg

    # Kubernetes >= v1.36 requires containerd 2.x; Debian 13 ships 1.7.
    - name: Add Docker APT repository (containerd.io)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [signed-by=/etc/apt/keyrings/docker-apt-keyring.gpg] https://download.docker.com/linux/debian {{ ansible_facts.distribution_release }} stable
        owner: root
        group: root
        mode: "0644"

    - name: Install kubelet, kubeadm, kubectl, containerd 2, and socat
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
          - containerd.io=2.*
          - socat
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Pin kubelet, kubeadm, kubectl, and containerd.io to their installed version
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl
        - containerd.io

    - name: Create CNI symlink for metrics server tools
      ansible.builtin.file:
        src: /opt/cni/bin
        dest: /usr/lib/cni
        state: link
        force: true

    - name: Ensure /etc/containerd directory exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Overwrites the packaged config, which disables the CRI plugin.
    # Config v3: keys may be absent from the defaults, so replace rather than edit.
    - name: Generate /etc/containerd/config.toml
      ansible.builtin.shell: |
        set -euo pipefail
        containerd config default > /etc/containerd/config.toml
        sed -i -e '/^\s*SystemdCgroup\s*=/d' -e '/^\s*sandbox\s*=/d' /etc/containerd/config.toml
      args:
        executable: /bin/bash
      changed_when: true

    - name: Configure /etc/containerd/config.toml
      ansible.builtin.shell: |
        set -euo pipefail
        PAUSE_IMAGE=$(kubeadm config images list | grep pause)
        sed -i \
          -e '/\.runtimes\.runc\.options\]$/a SystemdCgroup = true' \
          -e "/\.pinned_images\]$/a sandbox = '${PAUSE_IMAGE}'" \
          /etc/containerd/config.toml
        grep -qF "sandbox = '${PAUSE_IMAGE}'" /etc/containerd/config.toml
        grep -q '^SystemdCgroup = true$' /etc/containerd/config.toml
      args:
        executable: /bin/bash
      changed_when: true

    - name: Restart and enable containerd and kubelet services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: restarted
        daemon_reload: true
      loop:
        - containerd.service
        - kubelet.service
        - iscsid.service

    - name: Pull kubeadm container images
      ansible.builtin.command: kubeadm config images pull
      changed_when: true

    - name: Reboot VM to apply changes
      ansible.builtin.command: systemctl reboot
      async: 1
      poll: 0
      changed_when: true

    - name: Wait for VM to become reachable after reboot
      ansible.builtin.wait_for_connection:
        delay: 12
        sleep: 5
        timeout: 60

    - name: Wait for node services after reboot
      ansible.builtin.command: systemctl is-active {{ item }}
      register: node_service_status
      until: node_service_status.rc == 0 and node_service_status.stdout == 'active'
      retries: 30
      delay: 2
      changed_when: false
      loop:
        - containerd.service
        - iscsid.service

    - name: Wait for containerd CRI socket after reboot
      ansible.builtin.wait_for:
        path: /run/containerd/containerd.sock
        state: present
        timeout: 60

- name: Initialize Kubernetes control plane on first master node
  hosts: "{{ groups.get('k8s_masters', ['localhost'])[0] }}"
  gather_facts: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Skip host — already provisioned
      when: not is_fresh_install
      block:
        - name: Display already provisioned message
          ansible.builtin.debug:
            msg: "{{ vm_name }} is already provisioned. Skipping Kubernetes node setup."
        - name: End host
          ansible.builtin.meta: end_host

    - name: Extract master NAT IP address
      ansible.builtin.set_fact:
        node_ip: "{{ static_ip.split('/')[0] }}"

    - name: Check if Kubernetes control plane is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_admin_conf

    - name: Resolve NAT network interface name (for kube-vip)
      ansible.builtin.set_fact:
        vip_interface: "{{ ansible_facts.interfaces | map('extract', ansible_facts) | selectattr('macaddress', 'defined') | selectattr('macaddress', 'equalto', nat_mac) | map(attribute='device') | first }}"
      when: num_masters > 1

    - name: Ensure /etc/kubernetes/manifests directory exists
      ansible.builtin.file:
        path: /etc/kubernetes/manifests
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: num_masters > 1 and not k8s_admin_conf.stat.exists

    - name: Generate kube-vip static pod manifest for HA control-plane endpoint
      ansible.builtin.shell: |
        ctr image pull ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
        ctr run --rm --net-host ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }} kube-vip-manifest-gen \
          /kube-vip manifest pod \
          --interface {{ vip_interface }} \
          --address {{ control_plane_vip }} \
          --controlplane --services=false --arp --leaderElection \
          > /etc/kubernetes/manifests/kube-vip.yaml
      args:
        executable: /bin/bash
        creates: /etc/kubernetes/manifests/kube-vip.yaml
      when: num_masters > 1 and not k8s_admin_conf.stat.exists
      no_log: true

    # kubeadm's admin.conf is not usable until after the control plane
    # bootstraps (kubeadm >= v1.29); kube-vip's static pod starts from this
    # manifest before that point, so it must use super-admin.conf instead.
    - name: Point kube-vip manifest at super-admin.conf during bootstrap
      ansible.builtin.replace:
        path: /etc/kubernetes/manifests/kube-vip.yaml
        regexp: "path: /etc/kubernetes/admin.conf"
        replace: "path: /etc/kubernetes/super-admin.conf"
      when: num_masters > 1 and not k8s_admin_conf.stat.exists

    # certSANs are stored in kubeadm-config and reused by joining masters, so
    # list every master's br0 IP here to allow API access over br0.
    - name: Initialize Kubernetes cluster with kubeadm
      ansible.builtin.command: >
        kubeadm init
        --pod-network-cidr={{ pod_network_cidr }}
        --apiserver-advertise-address={{ node_ip }}
        --apiserver-cert-extra-sans={{ groups['k8s_masters'] | map('extract', hostvars, 'br0_ip') | map('regex_replace', '/.*$', '') | join(',') }}
        --node-name={{ vm_name }}
        --service-cidr=10.96.0.0/16
        {{ ('--control-plane-endpoint=' ~ control_plane_vip ~ ':' ~ control_plane_vip_port ~ ' --upload-certs') if num_masters > 1 else '' }}
      when: not k8s_admin_conf.stat.exists

    - name: Wait for kubelet after control-plane bootstrap
      ansible.builtin.command: systemctl is-active kubelet.service
      register: bootstrapped_kubelet_status
      until: bootstrapped_kubelet_status.rc == 0 and bootstrapped_kubelet_status.stdout == 'active'
      retries: 30
      delay: 2
      changed_when: false
      when: not k8s_admin_conf.stat.exists

    - name: Point kube-vip manifest back at admin.conf after bootstrap
      ansible.builtin.replace:
        path: /etc/kubernetes/manifests/kube-vip.yaml
        regexp: "path: /etc/kubernetes/super-admin.conf"
        replace: "path: /etc/kubernetes/admin.conf"
      when: num_masters > 1 and not k8s_admin_conf.stat.exists

    - name: Wait for kubelet to reload kube-vip static pod with admin.conf
      ansible.builtin.command: >
        kubectl --server=https://{{ node_ip }}:6443
        get pod -n kube-system kube-vip-{{ vm_name }}
        -o jsonpath='{.spec.volumes[?(@.name=="kubeconfig")].hostPath.path}:{.status.conditions[?(@.type=="Ready")].status}'
      register: kube_vip_pod_status
      until: kube_vip_pod_status.rc == 0 and kube_vip_pod_status.stdout == '/etc/kubernetes/admin.conf:True'
      retries: 30
      delay: 3
      changed_when: false
      when: num_masters > 1 and not k8s_admin_conf.stat.exists

    - name: Create .kube directories for admin user
      ansible.builtin.file:
        path: "/home/{{ admin_user }}/.kube"
        state: directory
        owner: "{{ admin_user }}"
        group: "users"
        mode: "0755"

    - name: Copy admin.conf for admin user kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ admin_user }}/.kube/config"
        remote_src: true
        owner: "{{ admin_user }}"
        group: "users"
        mode: "0600"

    - name: Wait for kube-vip HA endpoint to become reachable
      ansible.builtin.uri:
        url: "https://{{ control_plane_vip }}:{{ control_plane_vip_port }}/healthz"
        validate_certs: false
        status_code: 200
      register: vip_healthz_check
      until: vip_healthz_check.status == 200
      retries: 20
      delay: 5
      when: num_masters > 1

    - name: Download Tigera Calico operator manifest
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml"
        dest: /opt/tigera.yaml
        mode: "0644"

    - name: Apply Tigera Calico operator manifest
      ansible.builtin.command: kubectl apply --server-side -f /opt/tigera.yaml
      when: not k8s_admin_conf.stat.exists

    - name: Wait for Tigera operator CRDs to become established
      ansible.builtin.command: kubectl get crd installations.operator.tigera.io
      register: tigera_crd_check
      until: tigera_crd_check.rc == 0
      retries: 20
      delay: 3
      changed_when: false
      when: not k8s_admin_conf.stat.exists

    - name: Download Calico custom resources manifest
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/custom-resources.yaml"
        dest: /opt/calico.yaml
        mode: "0644"

    - name: Update Pod network CIDR in Calico manifest
      ansible.builtin.replace:
        path: /opt/calico.yaml
        regexp: "cidr:.*"
        replace: "cidr: {{ pod_network_cidr }}"

    - name: Disable Calico overlay encapsulation (nodes share one L2 segment)
      ansible.builtin.replace:
        path: /opt/calico.yaml
        regexp: "encapsulation:.*"
        replace: "encapsulation: None"

    - name: Pin Calico node IP autodetection to the NAT network
      ansible.builtin.lineinfile:
        path: /opt/calico.yaml
        insertafter: "^  calicoNetwork:$"
        line: "    nodeAddressAutodetectionV4:\n      cidrs:\n      - {{ calico_node_address_cidr }}"

    - name: Apply Calico custom resources manifest
      ansible.builtin.command: kubectl apply -f /opt/calico.yaml
      when: not k8s_admin_conf.stat.exists

    - name: Wait for Tigera operator deployment
      ansible.builtin.command: >
        kubectl wait --namespace tigera-operator
        --for=condition=Available deployment/tigera-operator
        --timeout=120s
      changed_when: false
      when: not k8s_admin_conf.stat.exists

    - name: Wait for Calico node DaemonSet to be created
      ansible.builtin.command: kubectl get daemonset calico-node --namespace calico-system
      register: calico_daemonset_check
      until: calico_daemonset_check.rc == 0
      retries: 30
      delay: 3
      changed_when: false
      when: not k8s_admin_conf.stat.exists

    - name: Wait for Calico node DaemonSet rollout
      ansible.builtin.command: >
        kubectl rollout status daemonset/calico-node
        --namespace calico-system
        --timeout=120s
      changed_when: false
      when: not k8s_admin_conf.stat.exists

    - name: Wait for Calico node pods
      ansible.builtin.command: >
        kubectl wait --namespace calico-system
        --for=condition=Ready pod --selector=k8s-app=calico-node
        --timeout=120s
      changed_when: false
      when: not k8s_admin_conf.stat.exists

    - name: Generate CA certificate hash
      ansible.builtin.shell: |
        openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt \
          | openssl rsa -pubin -outform der 2>/dev/null \
          | openssl dgst -sha256 -hex \
          | sed 's/^.* //'
      args:
        executable: /bin/bash
      register: ca_cert_hash_cmd
      changed_when: false
      # no_log: true

    - name: Create a fresh kubeadm join token
      ansible.builtin.command: kubeadm token create
      register: kubeadm_token_cmd
      changed_when: true
      no_log: true

    # Without a config, kubeadm uses the default-route interface (br0 on masters)
    # as the local API endpoint instead of the NAT IP.
    - name: Write kubeadm config pinning the local API endpoint to the NAT IP
      ansible.builtin.copy:
        dest: /etc/kubernetes/kubeadm-upload-certs.yaml
        content: |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: InitConfiguration
          localAPIEndpoint:
            advertiseAddress: {{ node_ip }}
        owner: root
        group: root
        mode: "0644"
      when: num_masters > 1

    - name: Upload control-plane certificates for HA master joins
      ansible.builtin.command: kubeadm init phase upload-certs --upload-certs --config /etc/kubernetes/kubeadm-upload-certs.yaml
      register: upload_certs_cmd
      changed_when: true
      no_log: true
      when: num_masters > 1

    - name: Extract certificate key from upload-certs output
      ansible.builtin.set_fact:
        k8s_certificate_key: "{{ upload_certs_cmd.stdout_lines[-1] | trim }}"
      no_log: true
      when: num_masters > 1

    - name: Set join facts on master host
      ansible.builtin.set_fact:
        k8s_ca_cert_hash: "{{ ca_cert_hash_cmd.stdout | trim }}"
        k8s_join_token: "{{ kubeadm_token_cmd.stdout | trim }}"
        k8s_certificate_key: "{{ k8s_certificate_key | default('') }}"
      no_log: true

- name: Join additional master nodes to Kubernetes cluster as control-plane
  hosts: "k8s_masters:!{{ groups.get('k8s_masters', ['localhost'])[0] }}"
  serial: 1
  gather_facts: false
  tasks:
    - name: Check if this master has already joined the cluster
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Resolve NAT network interface name (for kube-vip)
      ansible.builtin.set_fact:
        vip_interface: "{{ ansible_facts.interfaces | map('extract', ansible_facts) | selectattr('macaddress', 'defined') | selectattr('macaddress', 'equalto', nat_mac) | map(attribute='device') | first }}"
      when: not kubelet_conf.stat.exists

    - name: Join additional master node to cluster as control-plane
      ansible.builtin.command: >
        kubeadm join {{ control_plane_vip }}:{{ control_plane_vip_port }}
        --token {{ hostvars[groups['k8s_masters'][0]]['k8s_join_token'] }}
        --discovery-token-ca-cert-hash sha256:{{ hostvars[groups['k8s_masters'][0]]['k8s_ca_cert_hash'] }}
        --control-plane
        --certificate-key {{ hostvars[groups['k8s_masters'][0]]['k8s_certificate_key'] }}
        --apiserver-advertise-address={{ static_ip.split('/')[0] }}
      when: not kubelet_conf.stat.exists
      # no_log: true

    - name: Wait for kubelet after additional master join
      ansible.builtin.command: systemctl is-active kubelet.service
      register: joined_master_kubelet_status
      until: joined_master_kubelet_status.rc == 0 and joined_master_kubelet_status.stdout == 'active'
      retries: 30
      delay: 2
      changed_when: false
      when: not kubelet_conf.stat.exists

    - name: Generate kube-vip static pod manifest for HA control-plane endpoint
      ansible.builtin.shell: |
        ctr image pull ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
        ctr run --rm --net-host ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }} kube-vip-manifest-gen \
          /kube-vip manifest pod \
          --interface {{ vip_interface }} \
          --address {{ control_plane_vip }} \
          --controlplane --services=false --arp --leaderElection \
          > /etc/kubernetes/manifests/kube-vip.yaml
      args:
        executable: /bin/bash
        creates: /etc/kubernetes/manifests/kube-vip.yaml
      when: not kubelet_conf.stat.exists
      # no_log: true

    - name: Create .kube directories for admin user
      ansible.builtin.file:
        path: "/home/{{ admin_user }}/.kube"
        state: directory
        owner: "{{ admin_user }}"
        group: "users"
        mode: "0755"

    - name: Copy admin.conf for admin user kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ admin_user }}/.kube/config"
        remote_src: true
        owner: "{{ admin_user }}"
        group: "users"
        mode: "0600"

- name: Join worker nodes to Kubernetes cluster
  hosts: k8s_workers
  serial: 1
  gather_facts: false
  tasks:
    - name: Check if node has already joined the cluster
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Join worker node to Kubernetes cluster
      ansible.builtin.command: >
        kubeadm join {{ (control_plane_vip ~ ':' ~ control_plane_vip_port if num_masters > 1 else hostvars[groups['k8s_masters'][0]]['node_ip'] ~ ':6443') }}
        --token {{ hostvars[groups['k8s_masters'][0]]['k8s_join_token'] }}
        --discovery-token-ca-cert-hash sha256:{{ hostvars[groups['k8s_masters'][0]]['k8s_ca_cert_hash'] }}
      when: not kubelet_conf.stat.exists
      # no_log: true

    - name: Wait for kubelet after worker join
      ansible.builtin.command: systemctl is-active kubelet.service
      register: joined_worker_kubelet_status
      until: joined_worker_kubelet_status.rc == 0 and joined_worker_kubelet_status.stdout == 'active'
      retries: 30
      delay: 2
      changed_when: false
      when: not kubelet_conf.stat.exists

    - name: Pause for 3 seconds before proceeding to the next worker node
      ansible.builtin.pause:
        seconds: 3

- name: Verify Kubernetes cluster status
  hosts: "{{ groups.get('k8s_masters', ['localhost'])[0] }}"
  gather_facts: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Wait for all nodes to be Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=120s
      changed_when: false

    - name: Retrieve Kubernetes cluster node list
      ansible.builtin.command: kubectl get nodes -o wide
      register: kubectl_get_nodes
      changed_when: false

    - name: Remove control-plane taint from all masters
      ansible.builtin.command: >
        kubectl taint nodes {{ item }}
        node-role.kubernetes.io/control-plane:NoSchedule-
      loop: "{{ groups['k8s_masters'] }}"
      register: untaint_master
      until: "untaint_master.rc == 0 or 'not found' in untaint_master.stderr | lower"
      retries: 12
      delay: 5
      failed_when: "untaint_master.rc != 0 and 'not found' not in untaint_master.stderr | lower"
      changed_when: "'untainted' in untaint_master.stdout"
      when: remove_master_taint | bool

    - name: Display Kubernetes cluster nodes
      ansible.builtin.debug:
        var: kubectl_get_nodes.stdout_lines

- name: Run Kubernetes addons
  import_playbook: addons.yml

- name: Tear down Kubernetes VMs and NAT network (only run when explicitly requested with --tags teardown)
  hosts: localhost
  become: true
  gather_facts: false
  tags:
    - never
    - teardown
  vars:
    num_masters: 3
    num_workers: 3
    vm_name_prefix: "msksidb13k8sa"
    nat_network_name: "nat-{{ vm_name_prefix[-4:] }}"
    teardown_vm_names: []
    teardown_storage_paths: []
    target_disk_dir: "/nvme/vms"
    target_extra_disk_dir: "/data/VMS"
    uefi_nvram_dir: "/var/lib/libvirt/qemu/nvram"
  pre_tasks:
    - name: Build VM names for teardown
      ansible.builtin.set_fact:
        teardown_vm_names: "{{ teardown_vm_names + [vm_name_prefix ~ ('%02d' | format(idx + 1))] }}"
      loop: "{{ range(0, num_masters + num_workers) | list }}"
      loop_control:
        loop_var: idx

    - name: Build VM storage paths for teardown
      ansible.builtin.set_fact:
        teardown_storage_paths: >-
          {{ teardown_storage_paths + [
            target_disk_dir ~ '/' ~ item ~ '.qcow2',
            target_extra_disk_dir ~ '/' ~ item ~ '_extra.qcow2',
            uefi_nvram_dir ~ '/' ~ item ~ '_VARS.fd'
          ] }}
      loop: "{{ teardown_vm_names }}"
  tasks:
    - name: Check which VM domains exist
      ansible.builtin.command: "virsh -c qemu:///system dominfo {{ item }}"
      register: teardown_domain_info
      loop: "{{   teardown_vm_names }}"
      failed_when: false
      changed_when: false

    - name: Request graceful shutdown of existing VMs
      ansible.builtin.command: "virsh -c qemu:///system shutdown {{ item.item }}"
      loop: "{{ teardown_domain_info.results }}"
      when: item.rc == 0
      register: teardown_shutdown
      failed_when: "teardown_shutdown.rc != 0 and 'not running' not in teardown_shutdown.stderr | lower"
      changed_when: teardown_shutdown.rc == 0
      loop_control:
        pause: 5

    - name: Wait for existing VMs to shut down
      ansible.builtin.command: "virsh -c qemu:///system domstate {{ item.item }}"
      loop: "{{ teardown_domain_info.results }}"
      when: item.rc == 0
      register: teardown_vm_state
      until: "'shut off' in teardown_vm_state.stdout | lower"
      retries: 50
      delay: 5
      changed_when: false

    - name: Undefine existing VMs
      ansible.builtin.command: "virsh -c qemu:///system undefine {{ item.item }} --remove-all-storage --nvram"
      loop: "{{ teardown_domain_info.results }}"
      when: item.rc == 0
      register: teardown_undefine
      failed_when: "teardown_undefine.rc != 0 and 'domain not found' not in teardown_undefine.stderr | lower"
      changed_when: teardown_undefine.rc == 0
      loop_control:
        pause: 1

    - name: Remove leftover VM storage and NVRAM files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ teardown_storage_paths }}"

    - name: Destroy the libvirt NAT network
      ansible.builtin.command: "virsh -c qemu:///system net-destroy {{ nat_network_name }}"
      register: teardown_network_destroy
      failed_when: "teardown_network_destroy.rc != 0 and 'network not found' not in teardown_network_destroy.stderr | lower"
      changed_when: teardown_network_destroy.rc == 0

    - name: Undefine the libvirt NAT network
      ansible.builtin.command: "virsh -c qemu:///system net-undefine {{ nat_network_name }}"
      register: teardown_network_undefine
      failed_when: "teardown_network_undefine.rc != 0 and 'network not found' not in teardown_network_undefine.stderr | lower"
      changed_when: teardown_network_undefine.rc == 0
