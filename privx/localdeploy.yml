---
- name: Deploy KVM VM using local Oracle Linux 9 image
  hosts: localhost
  become: true
  vars:
    vm_name: "msksioel9prix01.local"
    vm_memory_kb: 2097152 # 2048 MB
    vm_vcpus: 4
    disk_size: "32G"
    admin_user: "madmin"
    ssh_pub_key_file: "/home/madmin/.ssh/ansible.pub"
    vm_autostart: false
    static_ip: "192.168.50.230/23"
    gateway_ip: "192.168.50.250"
    dns_servers:
      - "192.168.50.242"
      - "192.168.50.250"

    disk_dir: "/nvme/vms"
    template_image_path: "/data/ISO/VMIMAGES/KVM/ol9withuefi.qcow2"
    uefi_code_path: "{{ '/usr/share/OVMF/OVMF_CODE_4M.fd' if ansible_os_family == 'Debian' else '/usr/share/edk2/ovmf/OVMF_CODE.fd' }}"
    uefi_vars_template_path: "{{ '/usr/share/OVMF/OVMF_VARS_4M.fd' if ansible_os_family == 'Debian' else '/usr/share/edk2/ovmf/OVMF_VARS.fd' }}"
    uefi_vars_path: "/var/lib/libvirt/qemu/nvram/{{ vm_name }}_VARS.fd"
    emulator_path: "{{ '/usr/bin/qemu-system-x86_64' if ansible_os_family == 'Debian' else '/usr/libexec/qemu-kvm' }}"

  tasks:
    - name: Ensure required packages are installed (RedHat/CentOS/Fedora)
      ansible.builtin.package:
        name:
          - python3-libvirt
          - qemu-img
          - libvirt-client
          - edk2-ovmf
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Ensure UEFI firmware is installed (Debian/Ubuntu)
      ansible.builtin.package:
        name:
          - python3-libvirt
          - qemu-utils
          - libvirt-clients
          - ovmf
        state: present
      when: ansible_os_family == 'Debian'

    - name: Ensure libvirt UEFI NVRAM directory exists
      ansible.builtin.file:
        path: /var/lib/libvirt/qemu/nvram
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure target disk directory exists
      ansible.builtin.file:
        path: "{{ disk_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Check if VM domain exists in libvirt
      ansible.builtin.command: "virsh dominfo {{ vm_name }}"
      register: virsh_dominfo
      failed_when: false
      changed_when: false

    - name: Record if this is a fresh Day 1 deployment
      ansible.builtin.set_fact:
        is_fresh_install: "{{ virsh_dominfo.rc != 0 }}"

    - name: End play if VM was already provisioned
      ansible.builtin.meta: end_host
      when: not is_fresh_install

    - name: Check if destination image already exists
      ansible.builtin.stat:
        path: "{{ disk_dir }}/{{ vm_name }}.qcow2"
      register: destination_disk

    - name: Create standalone VM disk from local template
      ansible.builtin.copy:
        src: "{{ template_image_path }}"
        dest: "{{ disk_dir }}/{{ vm_name }}.qcow2"
        remote_src: true
        force: false
        owner: root
        group: root
        mode: "0644"
      when: not destination_disk.stat.exists

    - name: Resize the image to desired disk size
      ansible.builtin.command: qemu-img resize {{ disk_dir }}/{{ vm_name }}.qcow2 {{ disk_size }}
      register: resize_output
      changed_when: "'Image resized' in resize_output.stdout"
      when: not destination_disk.stat.exists

    - name: Defining Virtual Machine using XML
      community.libvirt.virt:
        command: define
        xml: |
          <domain type='kvm'>
            <name>{{ vm_name }}</name>
            <memory unit='KiB'>{{ vm_memory_kb }}</memory>
            <currentMemory unit='KiB'>{{ vm_memory_kb }}</currentMemory>
            <description>VM provisioned by Ansible</description>
            <vcpu placement='static'>{{ vm_vcpus }}</vcpu>
            <cpu mode='host-passthrough' check='none'>
              <topology sockets='1' dies='1' clusters='1' cores='{{ vm_vcpus }}' threads='1'/>
              <feature policy='require' name='vmx'/>
            </cpu>
            <os>
              <type arch='x86_64' machine='q35'>hvm</type>
              <loader readonly='yes' secure='no' type='pflash' format='raw'>{{ uefi_code_path }}</loader>
              <nvram template='{{ uefi_vars_template_path }}' templateFormat='raw' format='raw'>{{ uefi_vars_path }}</nvram>
              <boot dev='hd'/>
              <bootmenu enable='no'/>
            </os>
            <on_poweroff>destroy</on_poweroff>
            <on_reboot>restart</on_reboot>
            <on_crash>destroy</on_crash>
            <features>
              <acpi/>
              <apic/>
              <vmport state='off'/>
              <ioapic driver='kvm'/>
            </features>
            <clock offset='utc'>
              <timer name='rtc' tickpolicy='catchup'/>
              <timer name='pit' tickpolicy='delay'/>
              <timer name='hpet' present='no'/>
            </clock>
            <pm>
              <suspend-to-mem enabled='no'/>
              <suspend-to-disk enabled='no'/>
            </pm>
            <devices>
              <emulator>{{ emulator_path }}</emulator>
              <disk type='file' device='disk'>
                <driver name='qemu' type='qcow2' cache='writeback'/>
                <source file='{{ disk_dir }}/{{ vm_name }}.qcow2'/>
                <target dev='vda' bus='virtio'/>
              </disk>
              <interface type='bridge'>
                <source bridge='br0'/>
                <model type='virtio'/>
                <link state='up'/>
              </interface>
              <controller type='virtio-serial' index='0'/>
              <channel type='unix'>
                <source mode='bind'/>
                <target type='virtio' name='org.qemu.guest_agent.0'/>
                <address type='virtio-serial' controller='0' bus='0' port='1'/>
              </channel>
              <serial type='pty'>
                <target type='isa-serial' port='0'>
                  <model name='isa-serial'/>
                </target>
              </serial>
              <console type='pty'>
                <target type='serial' port='0'/>
              </console>
              <input type='mouse' bus='ps2'/>
              <input type='keyboard' bus='ps2'/>
              <graphics type='vnc' port='-1' autoport='yes' listen='0.0.0.0'/>
            </devices>
          </domain>
      when: is_fresh_install

    - name: Configure VM autostart
      community.libvirt.virt:
        name: "{{ vm_name }}"
        autostart: "{{ vm_autostart }}"

    - name: Ensure VM is started
      community.libvirt.virt:
        name: "{{ vm_name }}"
        state: running

    - name: Ensure guest agent is responding
      ansible.builtin.command: "virsh -c qemu:///system guestinfo {{ vm_name }}"
      register: agent_ready
      until: agent_ready.rc == 0
      retries: 20
      delay: 3
      changed_when: false

    - name: Add new VM to dynamic inventory (via Out-of-band Channel)
      ansible.builtin.add_host:
        name: "{{ vm_name }}"
        groups: spawned_vms
        vm_name: "{{ vm_name }}"
        ansible_connection: community.libvirt.libvirt_qemu
        ansible_libvirt_uri: "qemu:///system"
        ansible_libvirt_vm: "{{ vm_name }}"
        ansible_user: "root"
        admin_user: "{{ admin_user }}"
        ssh_pub_key_file: "{{ ssh_pub_key_file }}"
        is_fresh_install: "{{ is_fresh_install }}"
        static_ip: "{{ static_ip }}"
        dns_servers: "{{ dns_servers }}"
        gateway_ip: "{{ gateway_ip }}"

    #    - name: Pause for 30 seconds
    #      ansible.builtin.pause:
    #        seconds: 30


- name: Provision the spawned VM
  hosts: spawned_vms
  gather_facts: true
  tasks:
    - name: Wait for system to become reachable
      ansible.builtin.wait_for_connection:
        delay: 1
        sleep: 5
        timeout: 30

    - name: End play if VM was already provisioned
      ansible.builtin.meta: end_host
      when: not is_fresh_install

    - name: Expand OL9 root LVM volume
      ansible.builtin.shell: |
        PV_DEV=$(pvs --noheadings -o pv_name | tr -d ' ')
        echo fix | parted ---pretend-input-tty $(echo "$PV_DEV" | sed 's/p\?[0-9]*$//') print
        # growpart $(echo "$PV_DEV" | sed 's/p\?[0-9]*$//') $(echo "$PV_DEV" | grep -o '[0-9]*$')
        parted -s $(echo "$PV_DEV" | sed 's/p\?[0-9]*$//') resizepart $(echo "$PV_DEV" | grep -o '[0-9]*$') 100%
        pvresize $(pvs --noheadings -o pv_name)
        lvextend -r -l +100%FREE $(findmnt -n -o SOURCE /)
      args:
        executable: /bin/bash
      # become: true

    - name: Set hostname to '{{ vm_name }}'
      ansible.builtin.hostname:
        name: "{{ vm_name }}"
      # become: true

    # - name: Configure GRUB kernel cmdline for serial console
    #   ansible.builtin.lineinfile:
    #     path: /etc/default/grub
    #     regexp: '^GRUB_CMDLINE_LINUX='
    #     line: 'GRUB_CMDLINE_LINUX="console=tty1 console=ttyS0,115200n8"'
    #     backrefs: no
    #   register: grub_serial_console
    #   become: yes

    # - name: Rebuild grub config on Debian family
    #   ansible.builtin.command: update-grub
    #   when:
    #     - ansible_os_family == 'Debian'
    #     - grub_serial_console.changed
    #   become: yes

    # - name: Rebuild grub config on RedHat family
    #   ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
    #   when:
    #     - ansible_os_family == 'RedHat'
    #     - grub_serial_console.changed
    #   become: true

    # - name: Enable serial getty on ttyS0
    #   ansible.builtin.systemd:
    #     name: serial-getty@ttyS0.service
    #     enabled: true
    #     state: started
    #   become: true

    - name: Ensure the user admin exists
      ansible.builtin.user:
        name: "{{ admin_user }}"
        group: users
        groups: "{{ (ansible_os_family == 'Debian') | ternary('sudo', 'wheel') }}"
        append: true
        state: present
        create_home: true
        shell: /bin/bash
        update_password: on_create
        password: "{{ lookup('ansible.builtin.password', '/dev/null length=32') | password_hash('sha512') }}"

    - name: Create ssh directory
      ansible.builtin.file:
        path: "/home/{{ admin_user }}/.ssh"
        state: directory
        owner: "{{ admin_user }}"
        group: users
        mode: "0700"

    - name: Add SSH public key for admin user
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        state: present
        key: "{{ lookup('file', ssh_pub_key_file) }}"

    # - name: Remove default cloud users if they exist
    #   ansible.builtin.user:
    #     name: "{{ item }}"
    #     state: absent
    #     remove: yes
    #   loop:
    #     - ubuntu
    #     - debian
    #   when: item != admin_user

    - name: Configure passwordless sudo for admin user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL"
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

- name: Configure static IP
  hosts: spawned_vms
  gather_facts: false
  tasks:
    - name: End play if VM was already provisioned
      ansible.builtin.meta: end_host
      when: not is_fresh_install

    - name: Enable and start NetworkManager
      ansible.builtin.systemd:
        name: NetworkManager
        enabled: true
        state: started
      become: yes

    - name: Identify the primary Ethernet interface
      ansible.builtin.set_fact:
        primary_ethernet_interface: "{{ ansible_default_ipv4.interface }}"

    - name: Configure static IPv4 connection with NetworkManager
      ansible.builtin.shell: |
        set -e
        CONN_NAME=$(nmcli -g GENERAL.CONNECTION device show '{{ primary_ethernet_interface }}')
        nmcli connection modify "$CONN_NAME" \
          ipv4.method manual \
          ipv4.addresses '{{ static_ip }}' \
          ipv4.gateway '{{ gateway_ip }}' \
          ipv4.dns '{{ dns_servers | join(",") }}' \
          connection.autoconnect yes
        nmcli connection up "$CONN_NAME"
      args:
        executable: /bin/bash
      become: yes

    - name: Display VM Hostname and IP address summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - " VM Provisioning Summary"
          - " Hostname: {{ ansible_facts['hostname'] }}"
          - " Configured IP: {{ static_ip }}"
          - " Auto IPv4 Address: {{ ansible_facts['default_ipv4']['address'] | default('N/A') }}"
          - "=========================================="

- name: Update and install baseline tools on the spawned VM
  hosts: spawned_vms
  gather_facts: false
  tasks:
    - name: End play if VM was already provisioned
      ansible.builtin.meta: end_host
      when: not is_fresh_install

    # Already modified both in image
    # - name: Set FILTER_RPC_ARGS in /etc/sysconfig/qemu-ga
    #   ansible.builtin.lineinfile:
    #     path: /etc/sysconfig/qemu-ga
    #     regexp: "^#?FILTER_RPC_ARGS="
    #     line: 'FILTER_RPC_ARGS=""'
    #     state: present

    # - name: Set SELINUX to permissive in /etc/selinux/config
    #   ansible.builtin.lineinfile:
    #     path: /etc/selinux/config
    #     regexp: '^SELINUX='
    #     line: 'SELINUX=permissive'
    #     state: present

    - name: Upgrade all installed packages OS-agnostic way
      ansible.builtin.dnf:
        name: "*"
        state: latest
        exclude:
          - qemu-guest-agent*
      # become: yes (Not needed: Agent connection is already root-privileged)

    - name: Enable EPEL repository (Oracle Linux)
      ansible.builtin.dnf:
        name: "oracle-epel-release-el{{ ansible_distribution_major_version }}"
        state: present
      become: true
      when: ansible_distribution == "OracleLinux"

    - name: Ensure baseline tools are installed
      ansible.builtin.package:
        name:
          - htop
          - curl
          - wget
          - gnupg
          - nfs-utils
          - container-tools
          - chrony
        state: present

    - name: Reboot VM to apply network changes
      ansible.builtin.command: systemctl reboot
      async: 1
      poll: 0
      changed_when: true

    - name: Wait for VM to become reachable after reboot
      ansible.builtin.wait_for_connection:
        delay: 12
        sleep: 5
        timeout: 60

- name: Install PrivX
  hosts: spawned_vms
  gather_facts: false
  become: false
  tasks:
    - name: Create chrony directory
      ansible.builtin.file:
        path: /etc/chrony.d
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Configure NTP sources
      ansible.builtin.copy:
        dest: /etc/chrony.d/ntp.sources
        content: |
          pool pl.pool.ntp.org iburst
        owner: root
        group: root
        mode: "0644"

    - name: Restart chronyd
      ansible.builtin.systemd:
        name: chronyd
        state: restarted

    - name: Enable and start chronyd
      ansible.builtin.systemd:
        name: chronyd
        enabled: true
        state: started

    - name: Import SSH Communications Security repo GPG key
      ansible.builtin.rpm_key:
        key: "https://product-repository.ssh.com/info.fi-ssh.com-pubkey.asc"
        state: present

    - name: Add PrivX yum repository
      ansible.builtin.get_url:
        url: "https://product-repository.ssh.com/rhel9/ssh-products.repo"
        dest: /etc/yum.repos.d/ssh-products.repo
        owner: root
        group: root
        mode: "0644"

    - name: Install PrivX and PostgreSQL client
      ansible.builtin.dnf:
        name:
          - postgresql
          - PrivX
        state: present
        update_cache: true

- name: Create Postgresql database and user
  hosts: spawned_vms
  gather_facts: false
  vars:
    pg_host: "192.168.50.219"
    pg_user: "postgres"
    pg_password: "mandarynka"
    privx_postgres_name: "privx"
    privx_postgres_user: "privx"
    privx_postgres_password: "privx"
  tasks:
    - name: End play if VM was already provisioned
      ansible.builtin.meta: end_host
      when: not is_fresh_install

    - name: Check if PrivX database user exists
      ansible.builtin.command:
        cmd: >
          psql -h {{ pg_host }} -U {{ pg_user }} -d postgres -tAc
          "SELECT 1 FROM pg_roles WHERE rolname='{{ privx_postgres_user }}'"
      environment:
        PGPASSWORD: "{{ pg_password }}"
      register: privx_pg_user_check
      changed_when: false
      no_log: false

    - name: Create PrivX database user
      ansible.builtin.command:
        cmd: >
          psql -h {{ pg_host }} -U {{ pg_user }} -d postgres
          -v ON_ERROR_STOP=1 -v pw={{ privx_postgres_password | quote }} -f -
        stdin: 'CREATE ROLE "{{ privx_postgres_user }}" WITH LOGIN PASSWORD :''pw'';'
      environment:
        PGPASSWORD: "{{ pg_password }}"
      when: privx_pg_user_check.stdout | trim != '1'
      changed_when: true
      no_log: false

    - name: Ensure PrivX database user password is current
      ansible.builtin.command:
        cmd: >
          psql -h {{ pg_host }} -U {{ pg_user }} -d postgres
          -v ON_ERROR_STOP=1 -v pw={{ privx_postgres_password | quote }} -f -
        stdin: 'ALTER ROLE "{{ privx_postgres_user }}" PASSWORD :''pw'';'
      environment:
        PGPASSWORD: "{{ pg_password }}"
      changed_when: true
      no_log: false

    - name: Check if PrivX database exists
      ansible.builtin.command:
        cmd: >
          psql -h {{ pg_host }} -U {{ pg_user }} -d postgres -tAc
          "SELECT 1 FROM pg_database WHERE datname='{{ privx_postgres_name }}'"
      environment:
        PGPASSWORD: "{{ pg_password }}"
      register: privx_pg_db_check
      changed_when: false
      no_log: false

    - name: Create PrivX database
      ansible.builtin.command:
        cmd: >
          psql -h {{ pg_host }} -U {{ pg_user }} -d postgres
          -v ON_ERROR_STOP=1 -c
          "CREATE DATABASE \"{{ privx_postgres_name }}\" OWNER \"{{ privx_postgres_user }}\""
      environment:
        PGPASSWORD: "{{ pg_password }}"
      when: privx_pg_db_check.stdout | trim != '1'
      changed_when: true
      no_log: false

    - name: Add new VM to dynamic inventory (via Out-of-band Channel)
      ansible.builtin.add_host:
        name: "{{ vm_name }}"
        groups: spawned_vms
        pg_host: "{{ pg_host }}"
        pg_user: "{{ pg_user }}"
        pg_password: "{{ pg_password }}"
        privx_postgres_name: "{{ privx_postgres_name }}"
        privx_postgres_user: "{{ privx_postgres_user }}"
        privx_postgres_password: "{{ privx_postgres_password }}"

- name: Configure PrivX postinstall_env
  hosts: spawned_vms
  gather_facts: false
  # become: true
  vars:
    privx_env_file: /opt/privx/scripts/postinstall_env
    privx_env_settings:
      PRIVX_DNS_NAMES: '"{{ vm_name }}"'
      PRIVX_IP_ADDRESSES: '"{{ static_ip | split("/") | first }}"'
      PRIVX_SUPERUSER: "{{ admin_user }}"
      PRIVX_SUPERUSER_PASSWORD: "mandarynka"
      PRIVX_SUPERUSER_EMAIL: "{{ admin_user }}@example.com"
      PRIVX_SUPERUSER_CHANGE_PASSWORD: "true"
      PRIVX_POSTGRES_ADDRESS: "{{ pg_host }}"
      PRIVX_USE_EXTERNAL_DATABASE: "true"
      PRIVX_POSTGRES_PORT: "5432"
      PRIVX_DATABASE_USERNAME:  "{{ privx_postgres_user }}"
      PRIVX_DATABASE_PASSWORD: "{{ privx_postgres_password }}"
      PRIVX_DATABASE_NAME: "{{ privx_postgres_name }}"
      PRIVX_DATABASE_SSLMODE: "require"
  tasks:
    - name: End play if VM was already provisioned
      ansible.builtin.meta: end_host
      when: not is_fresh_install

    - name: Check if postinstall_env exists
      ansible.builtin.stat:
        path: "{{ privx_env_file }}"
      register: privx_env_stat

    - name: Fail if postinstall_env is missing
      ansible.builtin.assert:
        that: privx_env_stat.stat.exists
        fail_msg: "{{ privx_env_file }} not found; check the PrivX install."
        quiet: true

    - name: Set values in postinstall_env
      ansible.builtin.lineinfile:
        path: "{{ privx_env_file }}"
        regexp: "^export {{ item.key }}="
        line: "export {{ item.key }}={{ item.value }}"
        state: present
      loop: "{{ privx_env_settings | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true

    - name: Restrict postinstall_env permissions (contains passwords)
      ansible.builtin.file:
        path: "{{ privx_env_file }}"
        owner: root
        group: root
        mode: "0600"

    - name: Run installation
      ansible.builtin.shell: |
        source {{ privx_env_file }}
        /opt/privx/scripts/postinstall.sh
      args:
        executable: /bin/bash
      environment:
        LANG: en_US.UTF-8
        LC_ALL: en_US.UTF-8